<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{
    --bg:#0e1311;--panel:#121814;--header:#0f1412;--rail:#0d1210;--line:#232c26;--line2:#2d3730;
    --ink:#eaf0ec;--muted:#98a49d;--faint:#6a756e;--field:#161d18;
    --accent:#8ed3a6;--accent-2:#a6dcb8;--accent-ink:#0a2c1b;--accent-soft:rgba(142,211,166,.12);
    --blue:#6fa8e8;--amber:#e6c07b;--red:#e88a6a;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--ui);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  button{font-family:var(--ui);cursor:pointer;color:inherit}

  /* header + logo */
  #top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 14px;background:var(--header);border-bottom:1px solid var(--line);position:relative;z-index:20}
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .wm{display:inline-flex;align-items:baseline;font-size:22px;font-weight:700;letter-spacing:-.025em;color:var(--ink);line-height:1}
  .wm .tr{width:.60em;height:.92em;align-self:flex-end;transform:translateY(.02em)}
  .tr .g{fill:var(--accent)}
  .tag{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:450}
  #top nav{display:flex;gap:8px;flex:none}
  .nbtn{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px;font-size:12.5px;color:var(--ink);text-decoration:none;background:transparent;border:1px solid var(--line);border-radius:9px;transition:background .15s var(--ease),border-color .15s var(--ease)}
  .nbtn:hover{background:#18201b;border-color:#31413a}
  .nbtn svg{width:14px;height:14px;opacity:.85}

  #app{display:flex;height:calc(100vh - 54px)}
  /* icon rail */
  #rail{width:70px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 0;gap:2px}
  .rb{width:100%;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:none;color:var(--faint);font-size:10.5px;letter-spacing:.02em;transition:color .15s var(--ease),background .15s var(--ease);position:relative}
  .rb svg{width:21px;height:21px}
  .rb:hover{color:var(--muted);background:#12181400}
  .rb.on{color:var(--accent)}
  .rb.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:0 3px 3px 0;background:var(--accent)}

  #panel{width:330px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
  #body{flex:1;overflow-y:auto;padding:18px}
  #mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0}

  h3{font-size:16px;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 16px}
  .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:20px 0 8px;font-weight:600}
  .field{width:100%;height:37px;padding:0 12px;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:10px;font-family:var(--ui);transition:border-color .15s var(--ease)}
  .field:focus{border-color:var(--accent);outline:none}
  textarea.field{height:auto;padding:10px 12px;resize:vertical;min-height:76px;line-height:1.5}
  select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
  label.lb{display:block;font-size:12px;color:var(--muted);margin:13px 0 5px}
  label.lb b{color:var(--ink);font-weight:600}
  .btn{height:37px;padding:0 14px;font-size:13px;background:#18201b;color:var(--ink);border:1px solid var(--line2);border-radius:10px;transition:background .15s var(--ease),border-color .15s var(--ease)}
  .btn:hover{background:#1e271f;border-color:#37473f}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .btn.pri:hover{background:var(--accent-2)}
  .btn.wide{width:100%}
  .row{display:flex;gap:8px}

  .msg{font-size:13px;line-height:1.55;margin:10px 0;padding:11px 13px;border-radius:12px}
  .msg.you{background:#181f1a;border:1px solid var(--line)}
  .msg.branch{background:var(--accent-soft);border:1px solid rgba(142,211,166,.22)}
  .recipe{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  .err{background:rgba(232,138,106,.1);border:1px solid rgba(232,138,106,.3);color:#eab29f}

  .tool{padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
  .tool:hover{border-color:#3a4a41;background:#141b16}
  .tool .tt{font-size:13px;font-weight:600}
  .tool .td{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px}
  .badge{float:right;font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;margin-left:8px}

  .layer{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .dot{width:12px;height:12px;border-radius:4px;flex:none}
  .layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .layer input{accent-color:var(--accent)}
  .layer .x{color:var(--faint);border:none;background:none;font-size:16px;line-height:1}
  .layer .x:hover{color:var(--ink)}
  .legend{margin:1px 0 11px 22px}
  .legend .lgtop{color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-bottom:4px}
  .legend .lgbar{height:8px;border-radius:4px;background:linear-gradient(90deg,#14402a,#4bab72,#b7e4c7)}
  .legend .lgends{display:flex;justify-content:space-between;margin-top:3px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .empty{font-size:12.5px;color:var(--faint);text-align:center;padding:34px 12px;line-height:1.65}
  .empty svg{width:30px;height:30px;opacity:.5;margin-bottom:10px}

  .mapctl{position:absolute;z-index:5;background:rgba(14,19,17,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px}
  #search{top:14px;left:14px;width:320px;max-width:calc(100% - 96px);display:flex;align-items:center;padding-left:12px}
  #search svg{width:15px;height:15px;color:var(--faint);flex:none}
  #search input{flex:1;height:40px;padding:0 12px;background:none;border:none;color:var(--ink);font-size:13px;font-family:var(--ui)}
  #search input:focus{outline:none}
  #basemaps{top:14px;right:14px;display:flex;overflow:hidden;padding:3px}
  #basemaps button{padding:6px 12px;font-size:11.5px;color:var(--muted);background:none;border:none;border-radius:8px}
  #basemaps button.on{color:var(--accent-ink);background:var(--accent);font-weight:600}
  #draw{bottom:16px;left:14px;display:flex;overflow:hidden;padding:3px}
  #draw button{padding:7px 11px;font-size:11.5px;color:var(--muted);background:none;border:none;border-radius:8px}
  #draw button.on{color:var(--accent-ink);background:var(--accent);font-weight:600}
  #ac{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--line2);border-radius:11px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .aci{padding:10px 13px;font-size:12px;border-top:1px solid var(--line);line-height:1.4;cursor:pointer}
  .aci:first-child{border-top:none}
  .aci:hover{background:#18201b}
  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;font-family:var(--mono);font-size:11px;max-width:250px;white-space:pre-wrap;padding:10px 12px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-ctrl-attrib{background:rgba(14,19,17,.7)!important}
  .maplibregl-ctrl-attrib a{color:var(--muted)!important}

  dialog{max-width:470px;width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;box-shadow:0 24px 64px rgba(0,0,0,.55)}
  dialog::backdrop{background:rgba(6,10,8,.66);backdrop-filter:blur(3px)}
  /* Tool forms sit over the side panel, never over the map: the map has to stay
     visible and clickable so "click on the map to set" actually works. */
  dialog.tool{position:fixed;left:70px;top:54px;margin:0;width:330px;max-width:none;height:calc(100% - 54px);border-radius:0;border-top:none;border-bottom:none;display:flex;flex-direction:column;box-shadow:0 0 44px rgba(0,0,0,.5)}
  dialog.tool .db{overflow-y:auto}
  #dhint{bottom:58px;left:14px;max-width:290px;padding:7px 11px;font-size:11.5px;color:var(--muted);line-height:1.45}
  @media (max-width:820px){
    dialog.tool{left:0;top:auto;bottom:0;width:100%;height:auto;max-height:68vh;border-radius:16px 16px 0 0;border-left:none;border-right:none}
    #dhint{bottom:56px}}
  .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dh h3{margin:0;font-size:15px}
  .db{padding:18px 20px;max-height:74vh;overflow-y:auto}
  .dx{background:none;border:none;color:var(--muted);font-size:22px;line-height:1}
  .dx:hover{color:var(--ink)}
  .loading{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:13px;background:rgba(14,19,17,.6);backdrop-filter:blur(2px);color:var(--muted);font-size:13px}
  .loading.on{display:flex}
  .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid #263029;border-top-color:var(--accent);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
  @media (max-width:820px){body{overflow:auto}#app{flex-direction:column;height:auto}#rail{flex-direction:row;width:100%;height:auto}#rail .rb{height:54px;flex:1}#rail .rb.on::before{left:12px;right:12px;top:auto;bottom:0;width:auto;height:2.5px}#panel{width:100%}#mapwrap{height:56vh;min-height:360px}.tag{display:none}
    #search{left:14px;right:14px;width:auto;max-width:none}
    #basemaps{top:66px;right:14px}
    #draw{bottom:14px;left:14px}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="wm">b<svg class="tr" viewBox="0 0 22 28" aria-label="r"><rect class="g" x="7.75" y="13" width="5.5" height="13" rx="2.5"/><path class="g" d="M11 14 C 12 6.6 18.2 3 21 5.4 C 19.4 11.8 13 15.2 10.4 13.4 Z"/></svg>anch</span>
    <span class="tag">free, verified city-planning analysis</span>
  </div>
  <nav>
    <button class="nbtn" id="setBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.4a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1L9.5 21h5l.3-2.4a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg>AI settings</button>
    <a class="nbtn" href="https://github.com/BenMalaga/branch" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5A10.5 10.5 0 0 0 8.7 22c.5.1.7-.2.7-.5v-1.8c-2.9.6-3.5-1.4-3.5-1.4-.5-1.2-1.2-1.5-1.2-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.3-.3-4.7-1.2-4.7-5.1 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .9-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .6 1.4.2 2.4.1 2.7.7.7 1 1.6 1 2.7 0 3.9-2.3 4.8-4.6 5.1.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10.5 10.5 0 0 0 12 1.5Z"/></svg>GitHub</a>
  </nav>
</header>

<main id="app">
  <nav id="rail">
    <button class="rb on" data-t="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg>Ask</button>
    <button class="rb" data-t="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="17" r="2"/></svg>Tools</button>
    <button class="rb" data-t="layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Layers</button>
    <button class="rb" data-t="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data</button>
  </nav>
  <aside id="panel"><div id="body"></div></aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="search" class="mapctl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Search an address or place..." autocomplete="off"></div>

<div id="ac" hidden></div>

<dialog id="settings">
  <div class="dh"><h3>AI settings</h3><button class="dx" onclick="settings.close()">&times;</button></div>
  <div class="db">
    <p class="sub" style="margin:0 0 4px">branch's agent calls verified tools. Use your own key (never stored on any server, only in this browser) or a free local model, so your data stays yours.</p>
    <label class="lb">Provider</label>
    <select class="field" id="prov"><option value="anthropic">Anthropic (your key)</option><option value="openai">OpenAI (your key)</option><option value="ollama">Ollama (free, local)</option></select>

    <input class="field" id="model" placeholder="claude-sonnet-4-5">

    <input class="field" id="key" type="password" placeholder="sk-...">
    <div class="row" style="margin-top:18px"><button class="btn pri wide" onclick="saveSettings()">Save</button></div>
  </div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
const PALETTE=["#8ed3a6","#6fa8e8","#e6c07b","#e88a6a","#b9a1f0","#7fd6d6","#e79ac0"];
const BG="#0e1311";
const ACCENT="#8ed3a6";
let map, layers=[], colorI=0, tools=[], drawMode=null, drawPts=[], pickTarget=null;

const BASEMAPS={
  dark:{tiles:["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"],attr:"&copy; OpenStreetMap &copy; CARTO"},
  street:{tiles:["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png"],attr:"&copy; OpenStreetMap &copy; CARTO"},
  satellite:{tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],attr:"&copy; Esri, Maxar, Earthstar Geographics"},
};
function baseStyle(b){return {version:8,sources:{base:{type:"raster",tiles:BASEMAPS[b].tiles,tileSize:256,attribution:BASEMAPS[b].attr}},layers:[{id:"base",type:"raster",source:"base"}]};}

function init(){
  map=new maplibregl.Map({container:"map",style:baseStyle("dark"),center:[-73.98,40.672],zoom:13});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  new ResizeObserver(()=>map.resize()).observe($("mapwrap"));
  map.on("style.load",restyleLayers);
  map.on("click",onMapClick);
  map.doubleClickZoom.disable();
  wireTabs(); wireBasemaps(); wireDraw(); wireSearch(); wireSettings();
  loadTools().then(()=>{ if(getTab()==="tools")showTab("tools"); });
  showTab("ask");
}

// ---------- layers ----------
function addLayer(name,geojson,opts={}){
  const id="ly"+Date.now()+Math.floor(Math.random()*1e4);
  const color=opts.color||PALETTE[colorI++%PALETTE.length];
  const L={id,name,geojson,color,visible:true};
  layers.push(L); drawLayer(L);
  if(opts.fit!==false) fitTo(geojson);
  if(getTab()==="layers") showTab("layers");
  return L;
}
// choropleth: color features by a numeric value where one exists
const GRAD_FIELDS=["value_per_acre","tax_per_acre","count","suitability","score","reach_acres"];
function gradField(gj){ const fs=gj.features||[]; for(const c of GRAD_FIELDS){ if(fs.some(f=>typeof (f.properties||{})[c]==="number")) return c; } return null; }
function gradColor(field,gj){
  const v=(gj.features||[]).map(f=>f.properties[field]).filter(x=>typeof x==="number");
  const lo=Math.min(...v), hi=Math.max(...v); const h=hi>lo?hi:lo+1;
  return ["interpolate",["linear"],["get",field], lo,"#14402a",(lo+h)/2,"#4bab72",h,"#b7e4c7"];
}
const FIELD_LABEL={value_per_acre:"value / acre",tax_per_acre:"tax / acre",count:"count",suitability:"suitability",score:"score",reach_acres:"reach (acres)"};
function fmtVal(field,n){ if(n==null||isNaN(n))return "-"; const money=field==="value_per_acre"||field==="tax_per_acre"; const a=Math.abs(n); let s; if(a>=1e6)s=(n/1e6).toFixed(1).replace(/\.0$/,"")+"M"; else if(a>=1e3)s=(n/1e3).toFixed(1).replace(/\.0$/,"")+"k"; else s=(Math.round(n*10)/10).toString(); return money?"$"+s:s; }
function drawLayer(L){
  if(map.getSource(L.id)) return;
  map.addSource(L.id,{type:"geojson",data:L.geojson});
  const field=gradField(L.geojson); L.field=field;
  if(field){ const gv=(L.geojson.features||[]).map(f=>f.properties[field]).filter(x=>typeof x==="number"); L.lo=Math.min(...gv); L.hi=Math.max(...gv); }
  const col=field?gradColor(field,L.geojson):L.color;
  map.addLayer({id:L.id+"-fill",source:L.id,type:"fill",filter:["==","$type","Polygon"],paint:{"fill-color":col,"fill-opacity":field?0.6:0.22}});
  map.addLayer({id:L.id+"-line",source:L.id,type:"line",filter:["!=","$type","Point"],paint:{"line-color":field?"#0e1311":L.color,"line-width":field?0.6:2.5}});
  map.addLayer({id:L.id+"-pt",source:L.id,type:"circle",filter:["==","$type","Point"],paint:{"circle-radius":field?6:5,"circle-color":col,"circle-stroke-width":1.2,"circle-stroke-color":BG}});
  ["-fill","-line","-pt"].forEach(s=>map.on("click",L.id+s,popup));
}
function restyleLayers(){ layers.forEach(L=>{ drawLayer(L); setVis(L); }); addDrawPreviewLayers(); drawPreview(); }
function setVis(L){ ["-fill","-line","-pt"].forEach(s=>{ if(map.getLayer(L.id+s)) map.setLayoutProperty(L.id+s,"visibility",L.visible?"visible":"none"); }); }
function removeLayer(L){ ["-fill","-line","-pt"].forEach(s=>{ if(map.getLayer(L.id+s))map.removeLayer(L.id+s); }); if(map.getSource(L.id))map.removeSource(L.id); layers=layers.filter(x=>x!==L); showTab("layers"); }
function popup(e){ const p=e.features[0].properties||{}; const rows=Object.entries(p).slice(0,12).map(([k,v])=>`${k}: ${v}`).join("\n"); new maplibregl.Popup().setLngLat(e.lngLat).setText(rows||"(no attributes)").addTo(map); }
function fitTo(gj){ try{ const b=new maplibregl.LngLatBounds(); (gj.features||[]).forEach(f=>eachCoord(f.geometry,c=>b.extend(c))); if(!b.isEmpty())map.fitBounds(b,{padding:70,maxZoom:16}); }catch(e){} }
function eachCoord(g,cb){ if(!g)return; const t=g.type,c=g.coordinates; if(t==="Point")cb(c); else if(t==="LineString"||t==="MultiPoint")c.forEach(cb); else if(t==="Polygon"||t==="MultiLineString")c.forEach(r=>r.forEach(cb)); else if(t==="MultiPolygon")c.forEach(p=>p.forEach(r=>r.forEach(cb))); }

// ---------- tabs / panels ----------
function wireTabs(){ document.querySelectorAll(".rb").forEach(t=>t.onclick=()=>showTab(t.dataset.t)); }
function getTab(){ return document.querySelector(".rb.on")?.dataset.t; }
function showTab(t){
  document.querySelectorAll(".rb").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  const b=$("body");
  if(t==="ask"){ b.innerHTML=askHTML(); wireAsk(); }
  else if(t==="tools") b.innerHTML=toolsHTML();
  else if(t==="layers"){ b.innerHTML=layersHTML(); wireLayers(); }
  else if(t==="data"){ b.innerHTML=dataHTML(); wireData(); }
}

// ---------- ASK ----------
function askHTML(){ return `
  <h3>Ask the map</h3>
  <p class="sub">Ask a city-planning question in plain English. branch's agent runs real, verified tools and shows the answer plus a re-runnable recipe.</p>
  <textarea class="field" id="q2" placeholder="e.g. Estimate the cost to plant 20 trees along this street and their 20-year ROI."></textarea>
  <div class="row" style="margin-top:9px"><button class="btn pri wide" id="askBtn">Ask branch</button></div>
  <p class="sub" style="margin-top:10px">Uses your AI settings (top right). No key? Choose the free local Ollama option.</p>
  <div class="cat">No AI key? See it work</div>
  <button class="btn wide" onclick="runExample()">Try an example</button>
  <p class="sub" style="margin-top:8px">Loads real OpenStreetMap data for a block of Manhattan and maps how dense it is. No key needed, and it leaves a layer on the map so the other tools have something to work on.</p>
  <div id="thread"></div>`; }
function wireAsk(){ $("askBtn").onclick=ask; $("q2").addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")ask();}); }
async function callTool(id,params){
  const r=await fetch(`/api/tools/${id}/run`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(params)});
  const d=await r.json();
  if(d.error) throw new Error(d.error);
  return d.result;
}
window.runExample=async()=>{
  const bbox=[-73.9980,40.7250,-73.9850,40.7370];
  setLoading(true,"Loading OpenStreetMap data...");
  try{
    map.fitBounds([[bbox[0],bbox[1]],[bbox[2],bbox[3]]],{padding:60});
    const pts=await callTool("osm",{bbox,tags:{amenity:"restaurant"}});
    if(!pts||!(pts.features||[]).length) throw new Error("No features came back for the example area.");
    addLayer("Restaurants (OpenStreetMap)",pts,{fit:false});
    setLoading(true,"Aggregating to hexagons...");
    const hex=await callTool("density_hexbin",{layer:pts,resolution:9});
    if(hex&&(hex.features||[]).length) addLayer("Restaurant density",hex,{fit:false});
    showTab("layers");
  }catch(e){
    setLoading(false);
    showTab("ask");
    const th=$("thread");
    if(th) th.insertAdjacentHTML("beforeend",`<div class="msg err">Example failed: ${esc(e.message||"request failed")}</div>`);
  }finally{ setLoading(false); }
};
async function ask(){
  const q=$("q2").value.trim(); if(!q)return;
  const th=$("thread");
  th.insertAdjacentHTML("beforeend",`<div class="msg you">${esc(q)}</div>`);
  $("q2").value="";
  setLoading(true,"branch is reasoning...");
  try{
    const r=await fetch("/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,llm:llmConfig(),context:{layers:layers.map(l=>l.name)}})});
    const d=await r.json();
    if(d.error){ th.insertAdjacentHTML("beforeend",`<div class="msg err">${esc(d.error)}</div>`); }
    else{
      (d.layers||[]).forEach((ly,i)=>{ if(ly.geojson&&ly.geojson.features) addLayer(ly.tool||("result "+i),ly.geojson,{fit:i===0}); });
      const recipe=(d.steps||[]).map(s=>`${s.tool}(${JSON.stringify(s.params).slice(0,80)})`).join("\n");
      th.insertAdjacentHTML("beforeend",`<div class="msg branch">${esc(d.answer||"Done.")}${recipe?`<div class="recipe">${esc(recipe)}</div>`:""}</div>`);
    }
  }catch(e){ th.insertAdjacentHTML("beforeend",`<div class="msg err">Could not reach the server.</div>`); }
  setLoading(false); th.lastElementChild&&th.lastElementChild.scrollIntoView({block:"nearest"});
}

// ---------- TOOLS ----------
async function loadTools(){ try{ tools=await(await fetch("/api/tools")).json(); }catch(e){ tools=[]; } }
function toolsHTML(){
  const cats={}; tools.forEach(t=>(cats[t.category]=cats[t.category]||[]).push(t));
  const order=["planning","fiscal","geoprocessing","connector"];
  let h=`<h3>Tools</h3><p class="sub">Run a verified analysis. Every result becomes a layer you can inspect and reuse.</p>`;
  order.filter(c=>cats[c]).forEach(c=>{
    h+=`<div class="cat">${c==="fiscal"?"fiscal (money)":c}</div>`;
    cats[c].forEach(t=>h+=`<div class="tool" onclick='openTool("${t.id}")'><span class="badge">${t.returns}</span><div class="tt">${esc(t.title)}</div><div class="td">${esc(t.description)}</div></div>`);
  });
  return h;
}
// Tools that build a street network: slow the first time in a new area, then cached.
const SLOW_TOOLS=["walkshed","coolwalk"];
window.openTool=id=>{ const t=tools.find(x=>x.id===id); if(t) toolDialog(t); };
function toolDialog(t){
  const props=(t.params&&t.params.properties)||{}, req=(t.params&&t.params.required)||[];
  let fields="";
  for(const [k,p] of Object.entries(props)){
    const isLayer=(p.type==="object");
    const isBbox=(p.type==="array"&&(p.maxItems===4||k==="bbox"));
    const isPt=(p.type==="array"&&!isBbox);
    fields+=`<label class="lb"><b>${k}</b>${req.includes(k)?" *":""} ${esc(p.description||"")}</label>`;
    if(isLayer) fields+=layers.length
      ? `<select class="field" data-k="${k}" data-kind="layer">${layers.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join("")}</select>`
      : `<select class="field" data-k="${k}" data-kind="layer" disabled><option value="">no layers yet</option></select><p class="sub" style="margin-top:6px">This tool runs on a layer. Get one with <a href="#" onclick="this.closest('dialog').close();runExample();return false">Try an example</a>, load OpenStreetMap features from the Data tab, or drop in your own file.</p>`;
    else if(isBbox) fields+=`<button class="btn wide" type="button" data-k="${k}" data-kind="bbox" onclick="this.dataset.val=mapBbox();this.textContent='map view set'">Use current map view</button>`;
    else if(isPt) fields+=`<button class="btn wide" type="button" data-k="${k}" data-kind="point" onclick="pickPoint(this)">Click on the map to set</button>`;
    else if(p.enum) fields+=`<select class="field" data-k="${k}" data-kind="val">${p.enum.map(o=>`<option>${o}</option>`).join("")}</select>`;
    else fields+=`<input class="field" data-k="${k}" data-kind="val" ${p.type==="number"||p.type==="integer"?'type="number" step="any"':""} value="${p.default??""}" placeholder="${p.type}">`;
  }
  const dlg=document.createElement("dialog");
  dlg.innerHTML=`<div class="dh"><h3>${esc(t.title)}</h3><button class="dx">&times;</button></div><div class="db"><p class="sub">${esc(t.description)}</p>${fields}<div class="row" style="margin-top:18px"><button class="btn pri wide" id="runT">Run</button></div><div id="tout"></div></div>`;
  dlg.className="tool";
  document.body.appendChild(dlg); dlg.show();
  dlg.querySelector(".dx").onclick=()=>{dlg.close();dlg.remove();};
  dlg.querySelector("#runT").onclick=()=>runTool(t,dlg);
}
window.mapBbox=()=>{ const b=map.getBounds(); return JSON.stringify([b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]); };
window.pickPoint=btn=>{
  pickTarget=btn; btn.textContent="click the map...";
  map.getCanvas().style.cursor="crosshair";
  const h=$("dhint"); h.hidden=false; h.textContent="Click the map to set this location.";
};
function onMapClick(e){
  if(pickTarget){
    pickTarget.dataset.val=JSON.stringify([e.lngLat.lat,e.lngLat.lng]);
    pickTarget.textContent=`${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
    pickTarget=null;
    if(!drawMode) map.getCanvas().style.cursor="";
    syncDrawUI();
    return;
  }
  if(drawMode) drawClick(e);
}
async function runTool(t,dlg){
  const params={};
  dlg.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k,kind=el.dataset.kind; let v;
    if(kind==="layer"){ if(el.value!=="") v=layers[+el.value].geojson; }
    else if(kind==="bbox"||kind==="point"){ if(el.dataset.val) v=JSON.parse(el.dataset.val); }
    else{ v=el.value; if(el.type==="number"&&v!=="") v=+v; }
    if(v!==undefined&&v!=="") params[k]=v;
  });
  const out=dlg.querySelector("#tout");
  const need=((t.params&&t.params.required)||[]).filter(k=>params[k]===undefined);
  if(need.length){
    const props=(t.params&&t.params.properties)||{};
    const wantsLayer=need.some(k=>(props[k]||{}).type==="object");
    out.innerHTML=`<div class="msg err" style="margin-top:12px">Still needed: ${esc(need.join(", "))}.${wantsLayer?" Run Try an example on the Ask tab to put a layer on the map first.":""}</div>`;
    return;
  }
  out.innerHTML=`<p class="sub" style="margin-top:12px">Running...</p>`;
  setLoading(true,SLOW_TOOLS.includes(t.id)?`Running ${t.title}. The first run in a new area downloads OpenStreetMap data and can take up to a minute; nearby runs after that are quick.`:`Running ${t.title}...`);
  try{
    const r=await fetch(`/api/tools/${t.id}/run`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(params)});
    const d=await r.json();
    if(d.error){ out.innerHTML=`<div class="msg err" style="margin-top:12px">${esc(d.error)}</div>`; }
    else if(d.result&&d.result.type==="FeatureCollection"){ addLayer(t.title,d.result); out.innerHTML=`<div class="msg branch" style="margin-top:12px">Added ${d.result.features.length} features as a layer. See the Layers tab.</div>`; }
    else{ out.innerHTML=`<div class="msg branch" style="margin-top:12px"><div class="recipe">${esc(JSON.stringify(d.result,null,2))}</div></div>`; }
  }catch(e){ out.innerHTML=`<div class="msg err" style="margin-top:12px">Request failed.</div>`; }
  setLoading(false);
}

// ---------- LAYERS ----------
function layersHTML(){
  if(!layers.length) return `<h3>Layers</h3><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><br>No layers yet.<br>Run a tool, ask the map, or add your own data.</div><button class="btn wide" onclick="runExample()" style="margin-top:12px">Try an example</button>`;
  return `<h3>Layers</h3><p class="sub">${layers.length} layer${layers.length>1?"s":""}. Toggle, inspect, or remove.</p>`+layers.map((l,i)=>`<div class="layer"><span class="dot" style="background:${l.color}"></span><input type="checkbox" ${l.visible?"checked":""} data-i="${i}" class="lvis"><span class="nm">${esc(l.name)}</span><button class="x" data-i="${i}">&times;</button></div>`+(l.field?`<div class="legend"><div class="lgtop">${esc(FIELD_LABEL[l.field]||l.field)}</div><div class="lgbar"></div><div class="lgends"><span>${fmtVal(l.field,l.lo)}</span><span>${fmtVal(l.field,l.hi)}</span></div></div>`:"")).join("");
}
function wireLayers(){
  document.querySelectorAll(".lvis").forEach(c=>c.onchange=()=>{ const L=layers[+c.dataset.i]; L.visible=c.checked; setVis(L); });
  document.querySelectorAll(".layer .x").forEach(b=>b.onclick=()=>removeLayer(layers[+b.dataset.i]));
}

// ---------- DATA ----------
function dataHTML(){ return `
  <h3>Add your data</h3>
  <p class="sub">Drop a GeoJSON or CSV (with lat/lon columns) to bring your own layer. It stays in your browser, nothing is uploaded.</p>
  <label class="btn pri wide" style="display:block;text-align:center;line-height:37px">Choose a file<input type="file" id="file" accept=".geojson,.json,.csv" hidden></label>
  <div id="drop" style="margin-top:10px;padding:24px;border:1.5px dashed var(--line2);border-radius:11px;text-align:center;color:var(--faint);font-size:12.5px">or drag a file here</div>
  <div class="cat">Free public data</div>
  <p class="sub">Pull open data on demand. More connectors (Census, FEMA flood, social vulnerability, parcels) are on the way.</p>
  <button class="btn wide" onclick='openTool("osm")'>OpenStreetMap features for the map view</button>`; }
function wireData(){
  $("file").onchange=e=>readFile(e.target.files[0]);
  const d=$("drop");
  d.ondragover=e=>{e.preventDefault();d.style.borderColor="var(--accent)";};
  d.ondragleave=()=>d.style.borderColor="var(--line2)";
  d.ondrop=e=>{e.preventDefault();d.style.borderColor="var(--line2)";readFile(e.dataTransfer.files[0]);};
}
function readFile(f){ if(!f)return; const r=new FileReader(); r.onload=()=>{ try{
  let gj; if(f.name.toLowerCase().endsWith(".csv")) gj=csvToGeo(r.result); else gj=JSON.parse(r.result);
  if(gj.type==="Feature") gj={type:"FeatureCollection",features:[gj]};
  addLayer(f.name,gj); showTab("layers");
}catch(e){ alert("Could not read "+f.name+": "+e.message); } }; r.readAsText(f); }
function csvToGeo(txt){
  const lines=txt.trim().split(/\r?\n/), head=lines[0].split(",").map(s=>s.trim().toLowerCase());
  const la=head.findIndex(h=>["lat","latitude","y"].includes(h)), lo=head.findIndex(h=>["lon","lng","long","longitude","x"].includes(h));
  if(la<0||lo<0) throw new Error("need lat/lon columns");
  const feats=lines.slice(1).map(l=>{const c=l.split(","),p={};head.forEach((h,i)=>p[h]=c[i]);return {type:"Feature",geometry:{type:"Point",coordinates:[+c[lo],+c[la]]},properties:p};}).filter(f=>!isNaN(f.geometry.coordinates[0]));
  return {type:"FeatureCollection",features:feats};
}

// ---------- draw ----------
const DRAW_HINT={point:"Click the map to drop a point.",
  line:"Click to add points. Double-click, or press Finish, when the line is done. Esc cancels.",
  polygon:"Click to add corners. Double-click, or press Finish, to close the shape. Esc cancels."};
function wireDraw(){
  document.querySelectorAll("#draw button[data-d]").forEach(b=>b.onclick=()=>{
    if(b.dataset.d==="clear"){ setDrawMode(null); return; }
    setDrawMode(b.classList.contains("on")?null:b.dataset.d);
  });
  $("dfin").onclick=()=>finishDraw();
  map.on("dblclick",finishDraw);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&drawMode){ drawPts=[]; drawPreview(); syncDrawUI(); } });
}
function setDrawMode(m){
  drawMode=m; drawPts=[];
  document.querySelectorAll("#draw button[data-d]").forEach(x=>x.classList.toggle("on",!!m&&x.dataset.d===m));
  map.getCanvas().style.cursor=m?"crosshair":"";
  drawPreview(); syncDrawUI();
}
function syncDrawUI(){
  const shape=drawMode==="line"||drawMode==="polygon";
  $("dfin").hidden=!(shape&&drawPts.length>=(drawMode==="polygon"?3:2));
  const h=$("dhint"); h.hidden=!drawMode;
  if(drawMode) h.textContent=DRAW_HINT[drawMode]+(drawPts.length?`  (${drawPts.length} point${drawPts.length>1?"s":""})`:"");
}
// Live feedback while drawing. Without this the map looks broken: you click and
// nothing appears until the shape is finished.
function drawPreview(){
  const fc={type:"FeatureCollection",features:drawPts.map(c=>({type:"Feature",properties:{},geometry:{type:"Point",coordinates:c}}))};
  if(drawPts.length>1){
    const line=drawMode==="polygon"?[...drawPts,drawPts[0]]:drawPts;
    fc.features.push({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:line}});
  }
  const src=map.getSource("drawprev");
  if(src) src.setData(fc);
}
function addDrawPreviewLayers(){
  if(map.getSource("drawprev")) return;
  map.addSource("drawprev",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"drawprev-line",source:"drawprev",type:"line",filter:["==","$type","LineString"],
    paint:{"line-color":ACCENT,"line-width":2.5,"line-dasharray":[2,1.4]}});
  map.addLayer({id:"drawprev-pt",source:"drawprev",type:"circle",filter:["==","$type","Point"],
    paint:{"circle-radius":4.5,"circle-color":ACCENT,"circle-stroke-width":1.5,"circle-stroke-color":BG}});
}
function near(a,b){ return Math.abs(a[0]-b[0])<1e-7&&Math.abs(a[1]-b[1])<1e-7; }
function drawClick(e){
  const c=[e.lngLat.lng,e.lngLat.lat];
  if(drawMode==="point"){
    addLayer("drawn point",{type:"FeatureCollection",features:[{type:"Feature",geometry:{type:"Point",coordinates:c},properties:{drawn:true}}]},{fit:false});
    return;
  }
  drawPts.push(c); drawPreview(); syncDrawUI();
}
function finishDraw(e){
  if(!drawMode||drawMode==="point") return;
  if(e&&e.preventDefault) e.preventDefault();
  // A double-click fires two clicks first, so drop the repeated tail vertex.
  const pts=drawPts.slice();
  while(pts.length>1&&near(pts[pts.length-1],pts[pts.length-2])) pts.pop();
  if(pts.length<(drawMode==="polygon"?3:2)) return;
  const g=drawMode==="polygon"?{type:"Polygon",coordinates:[[...pts,pts[0]]]}:{type:"LineString",coordinates:pts};
  addLayer("drawn "+(drawMode==="polygon"?"area":drawMode),
    {type:"FeatureCollection",features:[{type:"Feature",geometry:g,properties:{drawn:true}}]},{fit:false});
  drawPts=[]; drawPreview(); syncDrawUI();
}

// ---------- basemaps / search / settings ----------
function wireBasemaps(){ document.querySelectorAll("#basemaps button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#basemaps button").forEach(x=>x.classList.toggle("on",x===b));
  map.setStyle(baseStyle(b.dataset.b)); }); }
function wireSearch(){ const q=$("q"); let tmr;
  q.oninput=()=>{ clearTimeout(tmr); const v=q.value.trim(); if(v.length<3){$("ac").hidden=true;return;} tmr=setTimeout(async()=>{
    try{ const rows=await(await fetch("/api/geocode?q="+encodeURIComponent(v))).json(); const ac=$("ac"); const r=$("search").getBoundingClientRect();
      ac.style.left=r.left+"px"; ac.style.top=(r.bottom+4)+"px"; ac.style.width=r.width+"px";
      ac.innerHTML=(Array.isArray(rows)?rows:[]).map((x,i)=>`<div class="aci" data-i="${i}">${esc(x.label.split(", ").slice(0,3).join(", "))}</div>`).join("")||`<div class="aci">No matches</div>`;
      ac.hidden=false; window._geo=rows;
      ac.querySelectorAll(".aci").forEach(el=>el.onmousedown=ev=>{ ev.preventDefault(); const x=window._geo[+el.dataset.i]; if(x){map.flyTo({center:[x.lon,x.lat],zoom:15}); new maplibregl.Marker({color:"#8ed3a6"}).setLngLat([x.lon,x.lat]).addTo(map);} ac.hidden=true; q.value=""; });
    }catch(e){} },350); };
  q.onblur=()=>setTimeout(()=>$("ac").hidden=true,200);
}
function wireSettings(){ $("setBtn").onclick=()=>{ const s=llmConfig(); $("prov").value=s.provider||"anthropic"; $("model").value=s.model||""; $("key").value=s.key||""; $("prov").onchange(); settings.showModal(); };
  $("prov").onchange=()=>{ const ol=$("prov").value==="ollama"; $("keyLb").style.opacity=ol?.4:1; $("key").disabled=ol; $("model").placeholder=ol?"llama3.1":($("prov").value==="openai"?"gpt-4o-mini":"claude-sonnet-4-5"); }; }
function llmConfig(){ try{ const c=JSON.parse(localStorage.getItem("branch_llm")||"{}"); return c.provider?c:{provider:"anthropic",model:"claude-sonnet-4-5"}; }catch(e){ return {provider:"anthropic"}; } }
window.saveSettings=()=>{ const c={provider:$("prov").value,model:$("model").value||$("model").placeholder,key:$("key").value}; localStorage.setItem("branch_llm",JSON.stringify(c)); settings.close(); };

// ---------- util ----------
function setLoading(on,msg){ $("loading").classList.toggle("on",on); if(msg)$("loadmsg").textContent=msg; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

init();
</script>
