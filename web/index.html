const baseStyle=b=>({version:8,sources:{base:{type:"raster",tiles:BASEMAPS[b].tiles,tileSize:256,
  attribution:BASEMAPS[b].attr}},layers:[{id:"base",type:"raster",source:"base"}]});


/* ---- Bringing your own data in ---------------------------------------------
   Dropping a file on the conversation is the fastest path from "I have a
   shapefile export" to "ask a question about it", so accept a drop anywhere on
   the workspace and tell the assistant what arrived. ------------------------ */
function noteUpload(name,count,warn){
  if(typeof pushMsg==="function"){
    pushMsg({role:"you",html:`Brought in <b>${esc(name)}</b> as a layer, `
      +`${count.toLocaleString()} feature${count===1?"":"s"}.`});
    if(warn) pushMsg({role:"branch",html:esc(warn)});
  }
  chat.push({role:"user",content:`I brought in a layer called "${name}" with ${count} features. `
    +`It is on the map and available to the tools.`});
}
// Coordinates can be perfectly valid and still be in the wrong hemisphere: a file
// tagged with the wrong EPSG lands in the Gulf of Guinea with in-range numbers and
// looks fine. Say so, but do not block: working on another city is normal.
function farFromView(gj){
  try{
    const pts=[]; (gj.features||[]).slice(0,200).forEach(f=>eachCoord(f.geometry,c=>pts.push(c)));
    if(!pts.length) return null;
    const lon=pts.reduce((a,c)=>a+c[0],0)/pts.length, lat=pts.reduce((a,c)=>a+c[1],0)/pts.length;
    const c=map.getCenter();
    const km=Math.hypot(rad(lat-c.lat),rad(lon-c.lng)*Math.cos(rad((lat+c.lat)/2)))*R_EARTH/1000;
    if(km<500) return null;
    return {km:Math.round(km),lon,lat};
  }catch(e){ return null; }
}
function wireDrop(){
  const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
  const zone=$("app")||document.body;
  ["dragenter","dragover"].forEach(k=>zone.addEventListener(k,e=>{ stop(e); zone.classList.add("dropping"); }));
  ["dragleave","drop"].forEach(k=>zone.addEventListener(k,e=>{
    if(k==="dragleave"&&e.relatedTarget) return;
    stop(e); zone.classList.remove("dropping");
  }));
  zone.addEventListener("drop",e=>{
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    if(!files.length) return;
    const ok=files.filter(f=>/\.(json|geojson|csv)$/i.test(f.name));
    if(!ok.length){
      openCard("That file type is not supported",
        `<div class="sec">branch reads GeoJSON and CSV. `
        +`For a shapefile, export it as GeoJSON first, in whatever made it.</div>`);
      return;
    }
    ok.forEach(readFile);
  });
}

/* ---- Interrogating what is on the map --------------------------------------
   An overlay you can only look at is decoration. Clicking a building should say
   what it is, how big its footprint is, and roughly how many floors, because
   that is the question a planner actually has. Overture's field names are not
   written for people, so translate them and stay quiet where there is no data
   rather than printing an empty row. --------------------------------------- */
const R_EARTH=6378137, rad=d=>d*Math.PI/180;
function ringAreaM2(r){
  let s=0;
  for(let i=0,n=r.length;i<n;i++){ const [x1,y1]=r[i],[x2,y2]=r[(i+1)%n];
    s+=(rad(x2)-rad(x1))*(2+Math.sin(rad(y1))+Math.sin(rad(y2))); }
  return Math.abs(s*R_EARTH*R_EARTH/2);
}
function geomAreaM2(g){
  if(!g) return 0;
  if(g.type==="Polygon") return g.coordinates.reduce((a,r,i)=>a+(i?-1:1)*ringAreaM2(r),0);
  if(g.type==="MultiPolygon") return g.coordinates.reduce((a,p)=>
    a+p.reduce((b,r,i)=>b+(i?-1:1)*ringAreaM2(r),0),0);
  return 0;
}
function segLenM(a,b){
  const dy=rad(b[1]-a[1]), dx=rad(b[0]-a[0]), m=rad((a[1]+b[1])/2);
  return Math.hypot(dy,dx*Math.cos(m))*R_EARTH;
}
function geomLenM(g){
  if(!g) return 0;
  const line=c=>c.reduce((t,p,i)=>i?t+segLenM(c[i-1],p):0,0);
  if(g.type==="LineString") return line(g.coordinates);
  if(g.type==="MultiLineString") return g.coordinates.reduce((t,c)=>t+line(c),0);
  return 0;
}
// the field that says what a feature IS, per Overture source layer
const OVERLAY_MAIN={building:"subtype",segment:"class",water:"subtype",land_cover:"subtype",
  land_use:"subtype",place:"categories",infrastructure:"subtype"};
function overlayPopup(e,ov){
  const f=e.features&&e.features[0]; if(!f) return;
  const p=f.properties||{}, sl=f.layer&&f.layer["source-layer"];
  const main=OVERLAY_MAIN[sl];
  const name=p["@name"]||p.name;
  const kind=(main&&p[main])?String(p[main]).replace(/_/g," "):String(sl||"").replace(/_/g," ");
  const bits=[];
  const push=(k,v,fmt)=>{ if(v!==undefined&&v!==null&&v!=="") bits.push([k,fmt?fmt(v):String(v)]); };
  push("type",p.subtype&&p.subtype!==p[main]?String(p.subtype).replace(/_/g," "):null);
  push("height",p.height,v=>`${Math.round(v)} m, about ${Math.max(1,Math.round(v/3.5))} floors`);
  push("floors",(p.min_floor!==undefined&&p.level!==undefined)?`${p.min_floor} to ${p.level}`:null);
  push("surface",p.road_surface||p.surface,v=>String(v).replace(/_/g," "));
  push("material",p.facade_material,v=>String(v).replace(/_/g," "));
  push("category",p.categories&&p.categories.primary,v=>String(v).replace(/_/g," "));
  push("brand",p.brand&&p.brand.names&&p.brand.names.primary);
  const g=f.geometry||{};
  if(String(g.type).includes("Polygon")){
    const a=geomAreaM2(g);
    if(a>0){
      bits.push(["footprint",`${qty(a,"m²")}, ${qty(a/M2_ACRE,"acres")}`]);
      if(p.height>0) bits.push(["floor area, roughly",qty(a*Math.max(1,Math.round(p.height/3.5)),"m²")]);
    }
  }
  if(String(g.type).includes("LineString")){
    const l=geomLenM(g);
    if(l>0) bits.push(["length of this piece",qty(l,"m")]);
  }
  const html=`<div class="pop"><div class="poptop">${esc(ov.label)}</div>`
    +(name?`<div class="popname">${esc(name)}</div>`:"")
    +(kind?`<div class="popkind">${esc(kind)}</div>`:"")
    +(bits.length?`<dl class="kv">`+bits.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")+`</dl>`
      :`<div class="sub">Overture publishes no further detail for this feature.</div>`)
    +`</div>`;
  new maplibregl.Popup({maxWidth:"300px",closeButton:true,className:"branchpop"})
    .setLngLat(e.lngLat).setHTML(html).addTo(map);
}
function wireOverlayClicks(ov){
  ov.layers.forEach(l=>{
    if(l.type==="fill-extrusion"||l.type==="fill"||l.type==="line"||l.type==="circle"){
      map.on("click",l.id,e=>overlayPopup(e,ov));
      map.on("mouseenter",l.id,()=>{ if(!drawMode) map.getCanvas().style.cursor="pointer"; });
      map.on("mouseleave",l.id,()=>{ if(!drawMode) map.getCanvas().style.cursor=""; });
    }
  });
}

/* ---- Sharing: a link re-runs the analysis, it does not carry a snapshot of
   the answer. That is the difference between "here is what I got" and "here is
   something you can check". ------------------------------------------------- */
const b64=t=>{const b=new TextEncoder().encode(t);let s="";for(const c of b)s+=String.fromCharCode(c);return btoa(s).replace(/=+$/,"");};
const unb64=t=>new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0)));
function shareState(){
  // A layer must be emitted after everything it was built from. Panel order is
  // presentation and the user can shuffle it, so sort by dependency and use
  // creation order only to break ties.
  const idx=new Map(), out=[];
  const pending=layers.filter(l=>l.src&&!l.src.f).sort((a,b)=>a.seq-b.seq);
  const refsOf=l=>Object.values(l.src.p||{}).filter(v=>v&&typeof v==="object"&&v.ref!==undefined);
  for(let moved=true; moved; ){
    moved=false;
    for(let i=0;i<pending.length;i++){
      const l=pending[i];
      if(l.src.d){ idx.set(l.id,out.length); out.push({n:l.name,d:l.geojson.features[0].geometry});
                   pending.splice(i--,1); moved=true; continue; }
      if(refsOf(l).some(v=>!idx.has(v.ref))) continue;      // an input has not been emitted yet
      const p={};
      for(const [k,v] of Object.entries(l.src.p||{}))
        p[k]=(v&&typeof v==="object"&&v.ref!==undefined)?{$:idx.get(v.ref)}:v;
      idx.set(l.id,out.length); out.push({n:l.name,t:l.src.t,p});
      pending.splice(i--,1); moved=true;
    }
  }   // anything left depends on an upload or a deleted layer, so it cannot travel
  const c=map.getCenter();
  return {st:{v:[+c.lat.toFixed(5),+c.lng.toFixed(5),+map.getZoom().toFixed(2),curBasemap],l:out},
          skipped:layers.length-out.length};
}
function setBasemapTo(b){
  if(!BASEMAPS[b]) return;
  curBasemap=b; waybackIdx=null;
  map.setStyle(baseStyle(b));
  document.querySelectorAll("#basemaps button").forEach(x=>x.classList.toggle("on",x.dataset.b===b));
}
function shareHash(){ return b64(JSON.stringify(shareState().st)); }
async function replayState(st){
  if(st.v){
    if(st.v[3]&&BASEMAPS[st.v[3]]&&st.v[3]!==curBasemap) setBasemapTo(st.v[3]);
    map.jumpTo({center:[st.v[1],st.v[0]],zoom:st.v[2]});
  }
  const items=st.l||[]; if(!items.length) return;
  busy(true,`Rebuilding a shared analysis: re-running ${items.length} step${items.length===1?"":"s"}`);
  const built=[];
  try{
    for(const it of items){
      if(it.d){
        built.push(addLayer(it.n||"Drawn area",
          {type:"FeatureCollection",features:[{type:"Feature",properties:{drawn:true},geometry:it.d}]},
          {fit:false,src:{d:{type:it.d.type}}}));
        continue;
      }
      const params={}, srcp={};
      for(const [k,v] of Object.entries(it.p||{})){
        if(v&&typeof v==="object"&&v.$!==undefined){
          const parent=built[v.$];
          params[k]=(parent||{}).geojson; srcp[k]={ref:(parent||{}).id};
        } else { params[k]=v; srcp[k]=v; }
      }
      const d=await callTool(it.t,params);
      built.push(addLayer(it.n||it.t,d.result,{fit:false,src:{t:it.t,p:srcp}}));
    }
    tab="layers"; renderPanel();
  }catch(e){
    openCard("Could not rebuild that analysis",
      `<div class="sec">${esc(e.message||"a step failed")}</div>`
      +`<div class="sec sub">The link is fine. A source it depends on may be unreachable right now.</div>`);
  }finally{ busy(false); }
}

/* ---- History: Esri publishes ~195 dated snapshots of world imagery as plain
   tiles, free and key-free, so "what did this block look like in 2016" costs a
   tile swap and no backend at all. ------------------------------------------- */
const WAYBACK_CONFIG="https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json";
let wayback=null, waybackIdx=null, waybackErr=null;
async function loadWayback(){
  if(wayback) return wayback;
  const cfg=await (await fetch(WAYBACK_CONFIG)).json();
  wayback=Object.values(cfg).map(v=>{
    const m=/(\d{4}-\d{2}-\d{2})/.exec(v.itemTitle||"");
    return (m&&v.itemURL)?{date:m[1],
      url:v.itemURL.replace("{level}","{z}").replace("{row}","{y}").replace("{col}","{x}")}:null;
  }).filter(Boolean).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return wayback;
}
function applyRelease(i){
  if(!wayback||!wayback[i]) return;
  waybackIdx=i;
  const lab=$("tdate"); if(lab) lab.textContent=wayback[i].date;
  const src=map.getSource("base");
  if(src&&src.setTiles) src.setTiles([wayback[i].url]);
}
function historyPanel(){
  if(waybackErr) return `<h2>History</h2><div class="empty">Could not load the list of imagery dates. `
    +`Esri's Wayback service did not answer. Try again in a moment.</div>`;
  if(!wayback) return `<h2>History</h2><p class="sub">Loading the dated imagery releases...</p>`;
  const i=waybackIdx==null?wayback.length-1:waybackIdx;
  return `<h2>History</h2>`
    +`<p class="sub">Esri's Wayback archive: ${wayback.length} dated snapshots of world imagery, `
    +`${wayback[0].date} to ${wayback[wayback.length-1].date}. Move the slider to change what the map shows.</p>`
    +`<div class="sec"><div class="secrow"><span class="lb">Imagery date</span>`
    +`<b id="tdate" class="tt">${esc(wayback[i].date)}</b></div>`
    +`<input id="tslider" type="range" min="0" max="${wayback.length-1}" value="${i}" `
    +`aria-label="Imagery date" style="width:100%;margin-top:8px">`
    +`<div class="row" style="margin-top:8px">`
    +`<button class="btn sm" id="tprev">Older</button>`
    +`<button class="btn sm" id="tnext">Newer</button>`
    +`<button class="btn sm" id="tlive">Current</button></div></div>`
    +`<p class="sub">Imagery is what a camera saw on that date. It is evidence of change, `
    +`not a measurement, so read it beside a tool result rather than instead of one.</p>`;
}
async function wireHistory(){
  if(!wayback&&!waybackErr){
    try{ await loadWayback(); }catch(e){ waybackErr=e; }
    if(tab==="history"){ $("panelBody").innerHTML=historyPanel(); wireHistory(); }
    return;
  }
  if(waybackErr) return;
  // entering History means the basemap has to be imagery for a date to mean anything
  document.querySelectorAll("#basemaps button").forEach(x=>x.classList.remove("on"));
  applyRelease(waybackIdx==null?wayback.length-1:waybackIdx);
  const sl=$("tslider");
  sl.oninput=()=>applyRelease(+sl.value);
  sl.onkeydown=e=>{ if(e.key==="ArrowLeft"||e.key==="ArrowRight") e.stopPropagation(); };
  const step=d=>{ const v=Math.min(Math.max(waybackIdx+d,0),wayback.length-1); sl.value=v; applyRelease(v); };
  $("tprev").onclick=()=>step(-1);
  $("tnext").onclick=()=>step(1);
  $("tlive").onclick=()=>{ setBasemapTo("satellite"); renderPanel(); };
}

/* ---- Audit: every layer knows which tool made it and from what, so the whole
   analysis can be written out as something a colleague or a council can read,
   check, and re-run. This is the claim the product is built on. -------------- */
function auditSteps(){
  const ordered=[...layers].sort((a,b)=>a.seq-b.seq);
  return ordered.map((l,i)=>{
    const n=((l.geojson||{}).features||[]).length, s=l.src;
    let how="added directly, by hand";
    if(s&&s.f) how=`imported from the file ${s.f}`;
    else if(s&&s.d) how=`drawn as a ${String(s.d.type||"shape").toLowerCase()} on the map`;
    else if(s&&s.t==="boundary") how=`brought in as an official border (${(s.p||{}).kind||"area"})`;
    else if(s&&s.t){
      const parts=Object.entries(s.p||{}).map(([k,v])=>{
        if(v&&typeof v==="object"&&v.ref!==undefined){
          const at=ordered.findIndex(x=>x.id===v.ref);
          return `${k} = ${at>=0?`step ${at+1} (${ordered[at].name})`:"a layer that has since been removed"}`;
        }
        return `${k} = ${JSON.stringify(v)}`;
      });
      how=`ran ${s.t}`+(parts.length?` with ${parts.join(", ")}`:"");
    }
    return {step:i+1,name:l.name,features:n,how};
  });
}
function auditPanel(){
  const st=auditSteps();
  if(!st.length) return `<h2>Audit</h2>`
    +`<div class="empty">Nothing has been computed yet. Run a tool, draw an area, or bring in a `
    +`border, and every step will be recorded here with what it was made from.</div>`;
  return `<h2>Audit</h2>`
    +`<p class="sub">Every layer, how it was made, and what it was made from, in the order it happened.</p>`
    +st.map(s=>`<div class="sec"><div class="stepline"><div class="stepn">${s.step}</div>`
      +`<div><div class="nm">${esc(s.name)}</div>`
      +`<div class="sub">${esc(s.how)}</div>`
      +`<div class="sub">${s.features.toLocaleString()} feature${s.features===1?"":"s"}</div>`
      +`</div></div></div>`).join("")
    +`<button class="btn wide pri" id="copyReport" style="margin-top:12px">Copy this as a report</button>`
    +`<p class="sub" id="reportNote" hidden></p>`;
}
function wireAudit(){
  const btn=$("copyReport"); if(!btn) return;
  btn.onclick=async()=>{
    const st=auditSteps();
    const link=location.origin+location.pathname+"#s="+shareHash();
    const md=["# branch analysis","",
      "Computed with branch (planwithbranch.com), an open-source city-planning tool,",
      "from free public data. Every step below can be re-run.","","## Steps",""]
      .concat(st.map(s=>`${s.step}. **${s.name}** - ${s.how}. ${s.features} feature${s.features===1?"":"s"}.`))
      .concat(["","## Reproduce this","",
        "Open the link below to re-run every step above against the same sources:","",link,""])
      .join("\n");
    const note=$("reportNote"); note.hidden=false;
    try{
      await navigator.clipboard.writeText(md);
      note.textContent=`Copied: ${st.length} step${st.length===1?"":"s"} plus a link that re-runs them.`;
    }catch(e){
      note.innerHTML=`<textarea class="field" readonly style="min-height:150px;width:100%">${esc(md)}</textarea>`;
    }
  };
}

async function init(){
  loadLayout(); applyLayout();
  if(window.pmtiles&&maplibregl.addProtocol) maplibregl.addProtocol("pmtiles",new pmtiles.Protocol().tile);
  map=new maplibregl.Map({container:"map",style:baseStyle("dark"),center:[-73.98,40.71],zoom:12.5});
  map.addControl(new maplibregl.NavigationControl({showCompass:true,visualizePitch:true}),"bottom-right");
  map.addControl(new maplibregl.ScaleControl({maxWidth:110,unit:"imperial"}),"bottom-left");
  map.doubleClickZoom.disable();
  new ResizeObserver(()=>map.resize()).observe($("stage"));
  map.on("style.load",()=>{
    layers.slice().reverse().forEach(L=>{ drawLayer(L); setVis(L); applyOpacity(L); });
    addDrawLayers(); drawPreview();
    OVERLAYS.filter(o=>active.has(o.id)).forEach(o=>{ try{ addOverlay(o); }catch(e){} });
  });
  map.on("click",e=>{
    if(pickTarget){ pickTarget.dataset.val=JSON.stringify([e.lngLat.lat,e.lngLat.lng]);
      pickTarget.textContent=`${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
      pickTarget=null; map.getCanvas().style.cursor=""; return; }
    if(drawMode==="polygon"){ drawPts.push([e.lngLat.lng,e.lngLat.lat]); drawPreview(); }
  });
  map.on("dblclick",e=>{ if(drawMode==="polygon"){ e.preventDefault(); finishDraw(); } });

  $("layoutBtn").onclick=e=>{ e.stopPropagation(); openAiMenu(false); openLayoutMenu(); };
  $("aiBtn").onclick=e=>{ e.stopPropagation(); openLayoutMenu(false); openAiMenu(); };
  document.addEventListener("click",e=>{
    if(!$("layoutMenu").contains(e.target)&&e.target!==$("layoutBtn")) openLayoutMenu(false);
    if(!$("aiMenu").contains(e.target)&&e.target!==$("aiBtn")) openAiMenu(false);
  });
  addEventListener("keydown",e=>{ if(e.key==="Escape"){ openLayoutMenu(false); openAiMenu(false); } });
  document.querySelectorAll("#basemaps button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#basemaps button").forEach(x=>x.classList.toggle("on",x===b));
    setBasemapTo(b.dataset.b);
  });
  document.querySelectorAll("#draw button").forEach(b=>b.onclick=()=>{
    if(b.dataset.d==="clear"){ drawMode=null; drawPts=[]; drawPreview();
      document.querySelectorAll("#draw button").forEach(x=>x.classList.remove("on"));
      map.getCanvas().style.cursor=""; return; }
    const on=b.classList.contains("on");
    document.querySelectorAll("#draw button").forEach(x=>x.classList.remove("on"));
    drawMode=on?null:"polygon"; drawPts=[]; drawPreview();
    if(!on) b.classList.add("on");
    map.getCanvas().style.cursor=drawMode?"crosshair":"";
  });
  addEventListener("keydown",e=>{ if(e.key==="Escape"){ drawPts=[]; drawPreview(); } });

  const q=$("q"); let tmr;
  q.oninput=()=>{ clearTimeout(tmr); const v=q.value.trim(); if(v.length<3) return;
    tmr=setTimeout(async()=>{
      try{
        const b=map.getBounds();
        const vb=[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(",");
        const rows=await (await fetch(`/api/geocode?q=${encodeURIComponent(v)}&viewbox=${vb}`)).json();
        if(!Array.isArray(rows)||!rows.length) return;
        openCard("Places",`<div class="sub">Fly to a place, or bring a border in as an area you can plan inside.</div>`
          +rows.slice(0,6).map((x,i)=>`<div class="sec"><div style="font-size:12.5px">${esc(x.label.split(", ").slice(0,3).join(", "))}</div>`
            +`<div class="row" style="margin-top:6px"><button class="btn sm" data-fly="${i}">Go there</button>`
            +(x.is_area?`<button class="btn sm" data-area="${i}">Use as area</button>`:"")+`</div></div>`).join(""));
        window._geo=rows;
        $("dockBody").querySelectorAll("[data-fly]").forEach(btn=>btn.onclick=()=>{
          const x=window._geo[+btn.dataset.fly]; map.flyTo({center:[x.lon,x.lat],zoom:14}); });
        $("dockBody").querySelectorAll("[data-area]").forEach(btn=>btn.onclick=async()=>{
          const x=window._geo[+btn.dataset.area];
          busy(true,`Fetching the border of ${x.label.split(",")[0]}`);
          try{
            const r=await fetch(`/api/boundary?osm_type=${x.osm_type}&osm_id=${x.osm_id}`);
            const d=await r.json(); if(d.error) throw new Error(d.error);
            const f=d.result.features[0];
            addLayer(`${f.properties.name} (${f.properties.kind})`,d.result,
              {fit:true,src:{t:"boundary",p:{name:f.properties.name,kind:f.properties.kind}}});
            areaCard(f.geometry); tab="layers"; renderPanel();
          }catch(err){ openCard("Could not load that border",`<div class="sec">${esc(err.message)}</div>`); }
          finally{ busy(false); }
        });
      }catch(e){}
    },350); };

  overlayBar();
  try{ tools=await (await fetch("/api/tools")).json(); }catch(e){ tools=[]; }
  renderPanel();
  const shared=/^#s=/.test(location.hash)?location.hash.slice(3):null;
  if(shared){
    let st=null;
    try{ st=JSON.parse(unb64(shared)); }catch(e){ st=null; }
    if(st){ map.once("load",()=>replayState(st).catch(()=>{})); }
    else openCard("That link could not be read",
      `<div class="sec">The share code in this address is damaged, so there is nothing to rebuild.</div>`);
  }
}
init();
</script>
