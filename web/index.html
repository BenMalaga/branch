<!doctype html>
<!--
  DIRECTION CONTRACT

  THESIS: results are not notes in a sidebar. A planner's output (a breakdown, a
  table, a profile) gets its own resizable surface beside the map, so the narrow
  column goes back to being navigation. Refuses the one-column app shell that
  stacks tools, layers, reports and tables into 330px until it scrolls sideways.

  OWN-WORLD: inherited and founder-pinned. Near-black grounds (#0e1311 map,
  #121814 panels, #0d1210 rail), pastel sage #8ed3a6 for action and selection
  only, system sans throughout, mono reserved for data. Hairline #232c26.

  STORY: I pick a place, choose data, run something, and read the answer at a
  size I can actually read, without losing the map.

  FIRST VIEWPORT: header, 70px icon rail, 300px navigation panel, map filling the
  rest, results dock closed until there is a result. Primary action ("Try an
  example") sits in the panel, above the fold.

  FORM: split canvas. Candidate 6 of 7 on the resonance list, assigned by
  concept-seed key 0601ec8f (surface, operate). Dealt challengers declined on
  named grounds: an Operate tool with a pinned minimalist world cannot take an
  anime crisis wall, a four-green Game Boy field, or an ANSI board.
-->

<style>
  :root{
    --bg:#0e1311;--panel:#121814;--header:#0f1412;--rail:#0d1210;--dock:#111713;
    --line:#232c26;--line2:#2d3730;--line3:#31413a;
    --ink:#eaf0ec;--muted:#98a49d;--faint:#7a877f;--field:#161d18;
    --surface:#18201b;--surface-2:#141b16;--surface-hover:#1e271f;--spin-track:#263029;
    --accent:#8ed3a6;--accent-2:#a6dcb8;--accent-ink:#0a2c1b;--accent-soft:rgba(142,211,166,.12);
    --blue:#6fa8e8;--amber:#e6c07b;--red:#e88a6a;--red-ink:#eab29f;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --rail-w:70px;--panel-w:300px;--dock-w:400px;--dock-h:320px;
    --pad:16px;--rowpad:9px;--fs:13px;--fs-sm:11.5px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:400 var(--fs)/1.5 var(--ui);background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---- frame ---------------------------------------------------------- */
  #top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px 0 14px;
    background:var(--header);border-bottom:1px solid var(--line);position:relative;z-index:30}
  .wm{display:inline-flex;align-items:baseline;font-size:22px;font-weight:700;
    letter-spacing:-.025em;line-height:1}
  .wm .tr{width:.445em;height:.562em;align-self:baseline;margin:0 .012em}
  .wm .tr .g{fill:var(--accent)}
  .wm .tr .lf{stroke:var(--accent);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
  .tag{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .nbtn{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px;
    font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;transition:background .15s var(--ease),border-color .15s var(--ease)}
  .nbtn:hover{background:var(--surface);border-color:var(--line3)}
  .nbtn svg{width:14px;height:14px;opacity:.85}

  #app{display:flex;height:calc(100vh - 54px);min-height:0}

  #rail{width:var(--rail-w);flex:none;background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:8px 0;gap:2px}
  .rb{width:100%;height:60px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;color:var(--faint);font-size:10.5px;position:relative;
    transition:color .15s var(--ease)}
  .rb svg{width:20px;height:20px}
  .rb:hover{color:var(--muted)}
  .rb.on{color:var(--accent)}
  .rb.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2.5px;
    border-radius:0 3px 3px 0;background:var(--accent)}

  #panel{width:var(--panel-w);flex:none;min-width:0;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line)}
  #panelBody{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:var(--pad)}
  /* compact trades breathing room for rows on screen; both are first-class */
  [data-density="compact"]{--pad:11px;--rowpad:6px;--fs:12.5px;--fs-sm:11px}

  #stage{flex:1;min-width:0;display:flex;position:relative}
  [data-dock="bottom"] #stage{flex-direction:column}
  #mapwrap{flex:1;min-width:0;position:relative}
  #map{position:absolute;inset:0}

  /* ---- the results dock: the whole point of this layout ---------------- */
  #dock{width:var(--dock-w);flex:none;min-width:0;display:none;flex-direction:column;
    background:var(--dock);border-left:1px solid var(--line2)}
  #dock.open{display:flex}
  [data-dock="bottom"] #dock{width:auto;height:var(--dock-h);border-left:none;
    border-top:1px solid var(--line2)}
  #dock.max{position:absolute;inset:0;z-index:12;width:auto;height:auto;border:none}
  #dockGrip{width:6px;flex:none;cursor:col-resize;background:transparent;display:none}
  #dockGrip.open{display:block}
  #dockGrip:hover{background:var(--line2)}
  [data-dock="bottom"] #dockGrip{width:auto;height:6px;cursor:row-resize}
  #panelGrip{width:6px;flex:none;cursor:col-resize;background:transparent}
  #panelGrip:hover{background:var(--line2)}
  .dtab[draggable="true"]{cursor:grab}
  .dtab.drag{opacity:.45}
  .dtab.over{border-color:var(--accent)}
  #dockHead{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;
    border-bottom:1px solid var(--line)}
  #dockHead b{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #dockBody{flex:1;min-width:0;overflow:auto;padding:14px}
  .dtabs{display:flex;gap:4px;padding:6px 8px 0;border-bottom:1px solid var(--line);
    overflow-x:auto;flex:none}
  .dtab{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:11.5px;
    color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
    white-space:nowrap}
  .dtab:hover{color:var(--ink)}
  .dtab.on{color:var(--ink);background:var(--dock);border-color:var(--line);
    box-shadow:0 1px 0 0 var(--dock)}
  .dtab .x{color:var(--faint);font-size:14px;line-height:1}
  .dtab .x:hover{color:var(--red)}

  /* ---- shared bits ----------------------------------------------------- */
  h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 4px}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 14px;
    overflow-wrap:anywhere}
  .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
    font-weight:600;margin:18px 0 8px}
  .cat:first-child{margin-top:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:37px;padding:0 14px;
    background:var(--surface);border:1px solid var(--line2);border-radius:10px;
    transition:background .15s var(--ease),border-color .15s var(--ease)}
  .btn:hover:not(:disabled){background:var(--surface-hover);border-color:var(--line3)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .btn.pri:hover:not(:disabled){background:var(--accent-2)}
  .btn.wide{width:100%}
  .btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .field{width:100%;height:37px;padding:0 12px;background:var(--field);border:1px solid var(--line2);
    border-radius:10px;transition:border-color .15s var(--ease)}
  .field:focus{border-color:var(--accent)}
  .field:focus:not(:focus-visible){outline:none}
  textarea.field{height:auto;min-height:74px;padding:10px 12px;resize:vertical}
  label.lb{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  label.lb b{color:var(--ink);font-weight:600}
  .empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.6;
    border:1px dashed var(--line2);border-radius:12px}

  /* a drop target has to announce itself or nobody tries it */
  #app.dropping::after{content:"Drop a GeoJSON or CSV to add it as a layer";position:fixed;inset:0;
    z-index:60;display:grid;place-items:center;background:rgba(14,19,17,.82);
    border:2px dashed var(--accent);font-size:14px;color:var(--ink);pointer-events:none}

  .grid tbody tr[data-pick]{cursor:pointer}
  .grid tbody tr[data-pick]:hover{background:var(--surface)}
  .grid tbody tr.picked{background:rgba(230,192,123,.14);box-shadow:inset 2px 0 0 var(--amber)}

  /* MapLibre's own controls ship light and unstyled. On a dark basemap each one
     is a white hole punched in the picture, so they are brought into the palette
     here rather than left as library defaults. */
  .maplibregl-ctrl-group{background:var(--panel) !important;border:1px solid var(--line2);
    border-radius:10px !important;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .maplibregl-ctrl-group button+button{border-top:1px solid var(--line)}
  .maplibregl-ctrl-group button{width:31px;height:31px;background:transparent}
  .maplibregl-ctrl-group button:hover{background:var(--surface)}
  .maplibregl-ctrl-group button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(88%) sepia(6%)
    saturate(180%) hue-rotate(90deg) brightness(96%)}
  .maplibregl-ctrl-scale{background:var(--panel) !important;color:var(--muted) !important;
    border:1px solid var(--line2) !important;border-top:none !important;
    border-radius:0 0 7px 7px;font-size:10.5px;padding:1px 6px;
    font-variant-numeric:tabular-nums}
  .maplibregl-ctrl-attrib{background:rgba(18,24,20,.86) !important;
    color:var(--faint) !important;
    border-radius:8px !important;padding:1px 8px !important;font-size:10.5px}
  .maplibregl-ctrl-attrib-inner{color:var(--faint)}
  .maplibregl-ctrl-attrib a{color:var(--faint) !important;text-decoration:none}
  .maplibregl-ctrl-attrib a:hover{color:var(--ink) !important;text-decoration:underline}
  .maplibregl-ctrl-attrib-button{filter:invert(80%)}
  .maplibregl-popup-content{background:var(--panel);color:var(--ink)}

  /* map popups: the library ships a white card, which is a hole punched in a dark map */
  .branchpop .maplibregl-popup-content{background:var(--panel);border:1px solid var(--line2);
    border-radius:12px;padding:11px 13px;box-shadow:0 12px 28px rgba(0,0,0,.5);color:var(--ink)}
  .branchpop .maplibregl-popup-tip{border-top-color:var(--panel);border-bottom-color:var(--panel)}
  .branchpop .maplibregl-popup-close-button{color:var(--faint);font-size:17px;padding:2px 7px;
    background:none;border:none;border-radius:7px}
  .branchpop .maplibregl-popup-close-button:hover{color:var(--ink);background:var(--surface)}
  .branchpop .maplibregl-popup-close-button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .pop .poptop{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .pop .popname{font-size:13.5px;margin-top:3px;overflow-wrap:anywhere}
  .pop .popkind{font-size:12px;color:var(--muted);margin-bottom:7px}
  .pop .kv{margin-top:6px}
  .pop .sub{margin:6px 0 0}

  /* label / value rows: one component, used by every panel that shows numbers */
  .kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;align-items:baseline;margin:0}
  .kv dt{font-size:11.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
  .kv dd{margin:0;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kvbig{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .kvbig span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
  .kvbig b{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .tool{padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
    cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
  .tool:hover{border-color:var(--line3);background:var(--surface-2)}
  .tool .tt{font-size:13px;font-weight:600}
  .tool .td{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px}
  .badge{float:right;margin-left:8px;padding:1px 6px;font:400 9.5px/1.6 var(--mono);
    color:var(--faint);border:1px solid var(--line2);border-radius:6px}

  .layer{display:flex;align-items:center;gap:9px;padding:var(--rowpad) 0;border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:4px;flex:none}
  .layer input.nm{flex:1;min-width:0;padding:3px 6px;font-size:12.5px;background:none;
    border:1px solid transparent;border-radius:7px;text-overflow:ellipsis}
  .layer input.nm:hover{border-color:var(--line2)}
  .layer input.nm:focus{border-color:var(--accent);background:var(--field);outline:none}
  .layer .ic{color:var(--faint);padding:3px;line-height:0;border-radius:6px}
  .layer .ic svg{width:15px;height:15px}
  .layer .ic:hover{color:var(--accent)}
  .lctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 12px 20px}
  .lctl input[type=range]{flex:1 1 100%;min-width:0;accent-color:var(--accent);height:16px}

  .mapctl{position:absolute;z-index:5;background:rgba(14,19,17,.92);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:11px}
  #search{top:14px;left:14px;right:auto;width:min(330px,calc(100% - 28px));display:flex;
    align-items:center;gap:9px;padding-left:12px}
  #search svg{width:15px;height:15px;color:var(--faint);flex:none}
  #search input{flex:1;min-width:0;height:38px;background:none;border:none;outline:none}
  #basemaps{top:14px;right:14px;display:flex;padding:3px}
  #basemaps button{padding:6px 11px;font-size:11.5px;color:var(--muted);border-radius:8px}
  #basemaps button.on{color:var(--accent-ink);background:var(--accent);font-weight:600}
  #overlays{top:62px;right:14px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;
    padding:6px;max-width:min(320px,calc(100% - 28px))}
  #overlays button{padding:5px 10px;font-size:11.5px;color:var(--muted);border:1px solid transparent;
    border-radius:8px;white-space:nowrap}
  #overlays button:hover{color:var(--ink);border-color:var(--line2)}
  #overlays button.on{color:var(--accent-ink);background:var(--accent);font-weight:600}
  #draw{bottom:16px;left:14px;display:flex;padding:3px}
  #draw button{padding:7px 11px;font-size:11.5px;color:var(--muted);border-radius:8px}
  #draw button.on{color:var(--accent-ink);background:var(--accent);font-weight:600}
  #busy{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(14,19,17,.72);backdrop-filter:blur(2px);
    text-align:center;padding:24px}
  #busy.on{display:flex}
  .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--spin-track);
    border-top-color:var(--accent);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #busy div:last-child{font-size:12.5px;color:var(--muted);max-width:34ch;line-height:1.5}

  table.grid{width:100%;border-collapse:collapse;font-size:11.5px}
  table.grid th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);text-align:left;
    padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-weight:600;cursor:pointer}
  table.grid th:hover{color:var(--ink)}
  table.grid td{padding:6px 10px;border-bottom:1px solid rgba(35,44,38,.7);white-space:nowrap;
    max-width:260px;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  table.grid tbody tr:hover{background:var(--surface)}

  #thread{max-height:42vh;overflow-y:auto;margin-bottom:12px}
  #thread:empty{display:none}
  .msg{font-size:12.5px;line-height:1.55;margin:8px 0;padding:10px 12px;border-radius:12px}
  .msg.you{background:var(--surface);border:1px solid var(--line)}
  .msg.branch{background:var(--accent-soft);border:1px solid rgba(142,211,166,.22)}
  .msg.err{background:rgba(232,138,106,.1);border:1px solid rgba(232,138,106,.3);color:var(--red-ink)}
  .receipt{margin-top:8px;padding:7px 9px;border-radius:9px;font-size:11px;line-height:1.5}
  .receipt.ok{background:rgba(142,211,166,.1);border:1px solid rgba(142,211,166,.28);color:var(--muted)}
  .receipt.warn{background:rgba(230,192,123,.1);border:1px solid rgba(230,192,123,.32);color:var(--amber)}
  .orphan{margin-top:3px;padding-left:7px;border-left:2px solid rgba(230,192,123,.45)}
  .orphan b{color:var(--amber)} .orphan span{color:var(--muted);font-style:italic}
  .steps{margin-top:8px}
  .steps summary{font-size:11px;color:var(--faint);cursor:pointer}
  .steps summary:hover{color:var(--muted)}
  .stepline{margin-top:5px;font-size:11px;color:var(--muted);line-height:1.45}
  .stepline b{color:var(--ink);display:block}
  .stepline .stepn{color:var(--accent);font-size:10.5px}
  .stepline span{font-family:var(--mono);font-size:10.5px;word-break:break-word}
  .pill{display:inline-block;padding:2px 9px;font-size:11px;border-radius:999px;
    border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--accent);border-color:rgba(142,211,166,.4);
    background:rgba(142,211,166,.1)}
  .pill.warn{color:var(--amber);border-color:rgba(230,192,123,.4);
    background:rgba(230,192,123,.1)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chips span{padding:2px 8px;font-size:10.5px;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:6px;text-transform:capitalize}
  .chips b{color:var(--ink);font-weight:600}
  .note{margin-top:10px;font-size:10.5px;color:var(--faint);line-height:1.45}
  .sec{padding:12px 0;border-top:1px solid var(--line)}
  .sec:first-child{border-top:none;padding-top:0}
  .sech{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:6px}

  #layoutBtn{position:relative}
  #layoutMenu{position:absolute;top:46px;right:16px;z-index:40;width:250px;padding:12px;
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PALETTE=["#8ed3a6","#6fa8e8","#e6c07b","#e88a6a","#b9a1f0","#7fd6d6","#e79ac0"];
const BG="#0e1311", ACCENT="#8ed3a6";
const M2_ACRE=4046.856;

let map, tools=[], layers=[], colorI=0, seq=0, tab="tools", drawMode=null, drawPts=[];
let curBasemap="dark";
let cards=[], activeCard=null;

/* ---- numbers: precision follows magnitude ---------------------------- */
function qty(n,unit){
  if(!isFinite(n)) return "-";
  const a=Math.abs(n), d=a>=100?0:a>=10?1:a>=1?2:3;
  return n.toLocaleString(undefined,{maximumFractionDigits:d})+(unit?" "+unit:"");
}
function fmtVal(k,v){
  if(typeof v!=="number") return String(v);
  if(/_usd$|^(value|tax|revenue|cost)_per_acre$|^cost$/.test(k))
    return "$"+Math.round(v).toLocaleString();
  // a count per acre is a rate, and small ones are the interesting ones
  if(/per_acre$/.test(k)) return v>=1?v.toFixed(2):v.toPrecision(3);
  if(/ratio/.test(k)) return v.toFixed(2);
  if(/years/.test(k)) return `${v} year${v===1?"":"s"}`;
  if(/rate$/.test(k)) return (v*100).toFixed(1)+"%";
  return qty(v);
}
const label=k=>String(k).replace(/_usd$/,"").replace(/_/g," ");

/* ---- the workspace is the user's, not ours ----------------------------- */
const SECTIONS=[
  {id:"ask",label:"Ask"},
  {id:"tools",label:"Tools"},
  {id:"layers",label:"Layers"},
  {id:"data",label:"Data"},
  {id:"saved",label:"Saved"},
  {id:"history",label:"History"},
  {id:"audit",label:"Audit"},
];
const LAYOUT_KEY="branch_layout";
const DEFAULT_LAYOUT={dock:"right",density:"cozy",panelW:300,dockW:400,dockH:320,
  order:["ask","tools","layers","data","history","audit","saved"],hidden:[]};
let layout={...DEFAULT_LAYOUT};
function loadLayout(){
  try{
    const saved=JSON.parse(localStorage.getItem(LAYOUT_KEY)||"{}");
    layout={...DEFAULT_LAYOUT,...saved};
    // a section added in a later version must still appear for existing users
    const known=SECTIONS.map(s=>s.id);
    layout.order=[...layout.order.filter(id=>known.includes(id)),
                  ...known.filter(id=>!layout.order.includes(id))];
    layout.hidden=(layout.hidden||[]).filter(id=>known.includes(id));
  }catch(e){ layout={...DEFAULT_LAYOUT}; }
}
function saveLayout(){ try{ localStorage.setItem(LAYOUT_KEY,JSON.stringify(layout)); }catch(e){} }
function applyLayout(){
  const r=document.documentElement;
  r.dataset.dock=layout.dock;
  r.dataset.density=layout.density;
  r.style.setProperty("--panel-w",layout.panelW+"px");
  r.style.setProperty("--dock-w",layout.dockW+"px");
  r.style.setProperty("--dock-h",layout.dockH+"px");
  renderRail();
  if(map) map.resize();
}
function visibleSections(){ return layout.order.filter(id=>!layout.hidden.includes(id)); }
function renderRail(){
  const icons={
    ask:'<path d="M12 3l1.7 4.6L18 9l-4.3 1.4L12 15l-1.7-4.6L6 9l4.3-1.4z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/>',
    saved:'<path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/>',
    tools:'<path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="17" r="2"/>',
    layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    history:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',
    audit:'<path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/><path d="M9 13l2 2 4-4"/>',
    data:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  };
  const vis=visibleSections();
  if(!vis.includes(tab)) tab=vis[0]||"tools";
  $("rail").innerHTML=vis.map(id=>{
    const sec=SECTIONS.find(s=>s.id===id);
    return `<button class="rb ${id===tab?"on":""}" data-t="${id}">`
      +`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${icons[id]}</svg>`
      +`${esc(sec.label)}</button>`;
  }).join("");
  $("rail").querySelectorAll(".rb").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; renderPanel(); });
}
function layoutMenuHTML(){
  const seg=(name,opts,cur)=>`<div class="seg">`+opts.map(([v,l])=>
    `<button data-set="${name}" data-val="${v}" class="${cur===v?"on":""}">${l}</button>`).join("")+`</div>`;
  return `<div class="cat">Results panel</div>`
    +seg("dock",[["right","Right"],["bottom","Bottom"]],layout.dock)
    +`<div class="cat">Density</div>`
    +seg("density",[["cozy","Cozy"],["compact","Compact"]],layout.density)
    +`<div class="cat">Sections</div>`
    +layout.order.map((id,i)=>{
      const sec=SECTIONS.find(s=>s.id===id);
      const on=!layout.hidden.includes(id);
      return `<div class="secrow">`
        +`<input type="checkbox" ${on?"checked":""} data-show="${id}" aria-label="Show ${esc(sec.label)}">`
        +`<span>${esc(sec.label)}</span>`
        +`<button data-move="${id}" data-dir="-1" ${i===0?"disabled":""} aria-label="Move up">&uarr;</button>`
        +`<button data-move="${id}" data-dir="1" ${i===layout.order.length-1?"disabled":""} aria-label="Move down">&darr;</button>`
        +`</div>`;
    }).join("")
    +`<button class="btn wide sm" id="resetLayout" style="margin-top:12px">Reset to defaults</button>`
    +`<div class="note">Saved in this browser. Drag the panel edge, the divider, or a result tab to rearrange.</div>`;
}
function openAiMenu(open){
  const m=$("aiMenu");
  const show=open===undefined?!m.classList.contains("open"):open;
  m.classList.toggle("open",show);
  if(!show) return;
  const c=llmConfig();
  m.innerHTML=`<div class="cat">Model</div>`
    +`<select class="field" id="prov">`
      +[["anthropic","Anthropic (your key)"],["openai","OpenAI (your key)"],
        ["ollama","Ollama (only if you run branch yourself)"]]
        .map(([v,l])=>`<option value="${v}" ${c.provider===v?"selected":""}>${l}</option>`).join("")
    +`</select>`
    +`<label class="lb" for="model">Model name</label>`
    +`<input class="field" id="model" value="${esc(c.model||"")}" placeholder="claude-sonnet-4-5">`
    +`<label class="lb" for="key">API key</label>`
    +`<input class="field" id="key" type="password" value="${esc(c.key||"")}" placeholder="stays in this browser">`
    +`<button class="btn pri wide" id="saveAi" style="margin-top:12px">Save</button>`
    +`<div class="note">Kept in this browser and sent only with your own requests. Never stored on the server.</div>`;
  $("saveAi").onclick=()=>{
    const cfg={provider:$("prov").value,model:$("model").value.trim(),key:$("key").value.trim()};
    try{ localStorage.setItem("branch_llm",JSON.stringify(cfg)); }catch(e){}
    openAiMenu(false);
  };
}
function openLayoutMenu(open){
  const m=$("layoutMenu");
  const show=open===undefined?!m.classList.contains("open"):open;
  m.classList.toggle("open",show);
  $("layoutBtn").setAttribute("aria-expanded",show?"true":"false");
  if(!show) return;
  m.innerHTML=layoutMenuHTML();
  m.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
    layout[b.dataset.set]=b.dataset.val; saveLayout(); applyLayout(); openLayoutMenu(true); });
  m.querySelectorAll("[data-show]").forEach(c=>c.onchange=()=>{
    const id=c.dataset.show;
    layout.hidden = c.checked ? layout.hidden.filter(x=>x!==id) : [...layout.hidden,id];
    if(!visibleSections().length){ layout.hidden=layout.hidden.filter(x=>x!==id); c.checked=true; }
    saveLayout(); applyLayout(); renderPanel(); openLayoutMenu(true); });
  m.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.move, d=+b.dataset.dir, i=layout.order.indexOf(id), j=i+d;
    if(j<0||j>=layout.order.length) return;
    [layout.order[i],layout.order[j]]=[layout.order[j],layout.order[i]];
    saveLayout(); applyLayout(); openLayoutMenu(true); });
  $("resetLayout").onclick=()=>{ layout={...DEFAULT_LAYOUT}; saveLayout(); applyLayout(); renderPanel(); openLayoutMenu(true); };
}

/* ---- results dock ------------------------------------------------------ */
function openCard(title,html){
  const id="c"+(++seq);
  cards.push({id,title,html});
  activeCard=id;
  renderDock();
}
function closeCard(id){
  cards=cards.filter(c=>c.id!==id);
  if(activeCard===id) activeCard=cards.length?cards[cards.length-1].id:null;
  renderDock();
}
function renderDock(){
  const open=cards.length>0;
  $("dock").classList.toggle("open",open);
  $("dockGrip").classList.toggle("open",open);
  if(!open) return;
  const cur=cards.find(c=>c.id===activeCard)||cards[cards.length-1];
  activeCard=cur.id;
  $("dockTabs").innerHTML=cards.map(c=>
    `<button class="dtab ${c.id===cur.id?"on":""}" data-c="${c.id}" draggable="true">${esc(c.title)}`
    +`<span class="x" data-close="${c.id}" title="Close">&times;</span></button>`).join("");
  $("dockTitle").textContent=cur.title;
  $("dockBody").innerHTML=cur.html;
  $("dockTabs").querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{
    if(e.target.dataset.close) return;
    activeCard=b.dataset.c; renderDock();
  });
  $("dockTabs").querySelectorAll("[data-close]").forEach(x=>x.onclick=e=>{
    e.stopPropagation(); closeCard(x.dataset.close);
  });
  wireDockTabs();
  wireDockBody();
}
// Result tabs are the user's workspace, so they can be put in whatever order the
// work wants, not the order things happened to be run.
function wireDockTabs(){
  let dragId=null;
  $("dockTabs").querySelectorAll(".dtab").forEach(t=>{
    t.ondragstart=e=>{ dragId=t.dataset.c; t.classList.add("drag");
      try{ e.dataTransfer.setData("text/plain",dragId); e.dataTransfer.effectAllowed="move"; }catch(err){} };
    t.ondragend=()=>{ dragId=null;
      $("dockTabs").querySelectorAll(".dtab").forEach(x=>x.classList.remove("drag","over")); };
    t.ondragover=e=>{ e.preventDefault(); if(t.dataset.c!==dragId) t.classList.add("over"); };
    t.ondragleave=()=>t.classList.remove("over");
    t.ondrop=e=>{
      e.preventDefault(); t.classList.remove("over");
      const from=cards.findIndex(c=>c.id===dragId), to=cards.findIndex(c=>c.id===t.dataset.c);
      if(from<0||to<0||from===to) return;
      const [moved]=cards.splice(from,1);
      cards.splice(to,0,moved);
      renderDock();
    };
  });
}
$("dockClose").onclick=()=>{ if(activeCard) closeCard(activeCard); };
$("dockMax").onclick=()=>{
  const max=$("dock").classList.toggle("max");
  $("dockMax").textContent=max?"Shrink":"Expand";
  if(map) map.resize();
};
function draggable(grip,onMove){
  let on=false;
  const start=e=>{ on=true; e.preventDefault(); document.body.style.userSelect="none"; };
  grip.addEventListener("mousedown",start);
  grip.addEventListener("touchstart",e=>{ start(e); },{passive:false});
  const move=(x,y)=>{ if(!on) return; onMove(x,y); if(map) map.resize(); };
  addEventListener("mousemove",e=>move(e.clientX,e.clientY));
  addEventListener("touchmove",e=>{ if(on&&e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  const end=()=>{ if(!on) return; on=false; document.body.style.userSelect=""; saveLayout(); };
  addEventListener("mouseup",end); addEventListener("touchend",end);
}
draggable($("dockGrip"),(x,y)=>{
  if(layout.dock==="bottom"){
    layout.dockH=Math.min(Math.max(innerHeight-y,160),Math.round(innerHeight*0.75));
    document.documentElement.style.setProperty("--dock-h",layout.dockH+"px");
  } else {
    layout.dockW=Math.min(Math.max(innerWidth-x,280),Math.round(innerWidth*0.65));
    document.documentElement.style.setProperty("--dock-w",layout.dockW+"px");
  }
});
draggable($("panelGrip"),(x)=>{
  const railW=$("rail").getBoundingClientRect().width;
  layout.panelW=Math.min(Math.max(x-railW,220),620);
  document.documentElement.style.setProperty("--panel-w",layout.panelW+"px");
});

function busy(on,msg){ $("busy").classList.toggle("on",!!on); if(msg) $("busyMsg").textContent=msg; }

/* ---- api --------------------------------------------------------------- */
async function callTool(id,params){
  const r=await fetch(`/api/tools/${id}/run`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(params)});
  const d=await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

/* ---- layers ------------------------------------------------------------ */
const GRAD=["value_per_acre","tax_per_acre","count","suitability","score","reach_acres","z_score"];
function gradField(gj){
  const fs=gj.features||[];
  for(const c of GRAD) if(fs.some(f=>typeof (f.properties||{})[c]==="number")) return c;
  return null;
}
// Columns worth shading by: numeric, varying, and not an identifier or a
// bookkeeping field the source happened to ship.
const NOT_A_MEASURE=/^(fid|objectid|oid|id|.*_id|shape_?_?(area|len|length)|globalid)$/i;
function shadeableFields(gj){
  const fs=(gj.features||[]).slice(0,500);
  const seen={};
  fs.forEach(f=>Object.entries(f.properties||{}).forEach(([k,v])=>{
    if(typeof v!=="number"||!isFinite(v)||NOT_A_MEASURE.test(k)) return;
    (seen[k]=seen[k]||new Set()).add(v);
  }));
  return Object.keys(seen).filter(k=>seen[k].size>1).sort();
}
function addLayer(name,geojson,opts={}){
  const id="ly"+(++seq);
  const L={id,name,geojson,color:opts.color||PALETTE[colorI++%PALETTE.length],
    visible:true,opacity:1,seq,src:opts.src||null};
  layers.unshift(L);
  drawLayer(L);
  if(opts.fit!==false) fitTo(geojson);
  if(tab==="layers") renderPanel();
  return L;
}
function drawLayer(L){
  if(map.getSource(L.id)) return;
  map.addSource(L.id,{type:"geojson",data:L.geojson});
  const field=(L.shadeBy===null?null
              :L.shadeBy!==undefined?L.shadeBy
              :gradField(L.geojson));
  L.field=field;
  let col=L.color;
  if(field){
    const v=(L.geojson.features||[]).map(f=>f.properties[field]).filter(x=>typeof x==="number").sort((a,b)=>a-b);
    L.lo=v[0]; L.hi=v[v.length-1];
    const at=q=>v[Math.min(v.length-1,Math.floor(q*(v.length-1)))];
    const stops=[at(0),at(.25),at(.5),at(.75),at(1)];
    const ramp=["#14402a","#2c6b45","#4bab72","#89cfa3","#c7ead4"];
    const expr=["interpolate",["linear"],["get",field]];
    let last=-Infinity;
    stops.forEach((s,i)=>{ const val=s<=last?last+1e-6:s; last=val; expr.push(val,ramp[i]); });
    col=expr;
  }
  map.addLayer({id:L.id+"-fill",source:L.id,type:"fill",filter:["==","$type","Polygon"],
    paint:{"fill-color":col,"fill-opacity":field?0.6:0.24}});
  map.addLayer({id:L.id+"-line",source:L.id,type:"line",filter:["!=","$type","Point"],
    paint:{"line-color":field?"#0e1311":L.color,"line-width":field?0.6:2.2}});
  map.addLayer({id:L.id+"-pt",source:L.id,type:"circle",filter:["==","$type","Point"],
    paint:{"circle-radius":field?6:5,"circle-color":col,"circle-stroke-width":1.2,
      "circle-stroke-color":BG}});
  ["-fill","-line","-pt"].forEach(s=>map.on("click",L.id+s,e=>featureCard(e,L)));
}
function setVis(L){ ["-fill","-line","-pt"].forEach(s=>{
  if(map.getLayer(L.id+s)) map.setLayoutProperty(L.id+s,"visibility",L.visible?"visible":"none"); }); }
function applyOpacity(L){
  const o=L.opacity==null?1:L.opacity, base=L.field?0.6:0.24;
  if(map.getLayer(L.id+"-fill")) map.setPaintProperty(L.id+"-fill","fill-opacity",base*o);
  if(map.getLayer(L.id+"-line")) map.setPaintProperty(L.id+"-line","line-opacity",o);
  if(map.getLayer(L.id+"-pt")) map.setPaintProperty(L.id+"-pt","circle-opacity",o);
}
// Take the drawing off the map but keep the layer. drawLayer() bails when the
// source already exists, so recolouring means tearing the paint down first.
function removeLayerPaint(L){
  ["-fill","-line","-pt"].forEach(s=>{ if(map.getLayer(L.id+s)) map.removeLayer(L.id+s); });
  if(map.getSource(L.id)) map.removeSource(L.id);
}
function removeLayer(L){
  removeLayerPaint(L);
  layers=layers.filter(x=>x!==L);
  renderPanel();
}
function eachCoord(g,cb){ if(!g)return; const t=g.type,c=g.coordinates;
  if(t==="Point")cb(c); else if(t==="LineString"||t==="MultiPoint")c.forEach(cb);
  else if(t==="Polygon"||t==="MultiLineString")c.forEach(r=>r.forEach(cb));
  else if(t==="MultiPolygon")c.forEach(p=>p.forEach(r=>r.forEach(cb))); }
function fitTo(gj){ try{ const b=new maplibregl.LngLatBounds();
  (gj.features||[]).forEach(f=>eachCoord(f.geometry,c=>b.extend(c)));
  if(!b.isEmpty()) map.fitBounds(b,{padding:60,maxZoom:16}); }catch(e){} }

      +`<button class="ic" data-rm="${i}" title="Remove" aria-label="Remove ${esc(l.name)}">&times;</button></div>`

function dataPanel(){
  return `<h2>Data</h2><p class="sub">Bring your own, or pull free public data for the current view.</p>`
    +`<label class="btn wide" style="cursor:pointer">Open a GeoJSON or CSV`
    +`<input type="file" id="file" accept=".geojson,.json,.csv" hidden></label>`

function wirePanel(){
  const el=$("panelBody");
  el.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>openTool(b.dataset.tool));
  const ex=$("ex"); if(ex) ex.onclick=runExample;
  const f=$("file"); if(f) f.onchange=e=>readFile(e.target.files[0]);
  el.querySelectorAll("[data-shade]").forEach(sel=>sel.onchange=()=>{
    const L=layers[+sel.dataset.shade]; if(!L) return;
    L.shadeBy=sel.value||null;
    removeLayerPaint(L); drawLayer(L); setVis(L); applyOpacity(L);
  });
  el.querySelectorAll("[data-vis]").forEach(c=>c.onchange=()=>{
    const L=layers[+c.dataset.vis]; L.visible=c.checked; setVis(L); });
  el.querySelectorAll("[data-op]").forEach(r=>r.oninput=()=>{
    const L=layers[+r.dataset.op]; L.opacity=+r.value/100; applyOpacity(L); });
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeLayer(layers[+b.dataset.rm]));
  el.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>fitTo(layers[+b.dataset.zoom].geojson));
  el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>download(layers[+b.dataset.dl]));
  el.querySelectorAll("[data-tbl]").forEach(b=>b.onclick=()=>tableCard(layers[+b.dataset.tbl]));
  el.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>profileCard(layers[+b.dataset.chk]));
  el.querySelectorAll("[data-nm]").forEach(inp=>{
    const commit=()=>{ const L=layers[+inp.dataset.nm]; if(!L) return;
      const v=inp.value.trim(); if(!v){ inp.value=L.name; return; } L.name=v; };
    inp.onchange=commit; inp.onblur=commit;
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } };
  });
}

/* ---- Saved work: keep it, reopen it, take it with you ------------------ */
const SAVED_KEY="branch_saved";
function loadSaved(){ try{ return JSON.parse(localStorage.getItem(SAVED_KEY)||"[]"); }catch(e){ return []; } }
function putSaved(l){ try{ localStorage.setItem(SAVED_KEY,JSON.stringify(l)); }catch(e){
  openCard("Could not save",`<div class="sec">This browser refused to store that, which usually means it is out of space.</div>`); } }
function snapshot(){
  const c=map.getCenter();
  return {v:[+c.lat.toFixed(5),+c.lng.toFixed(5),+map.getZoom().toFixed(2)],
          overlays:[...active],
          layers:layers.map(l=>({name:l.name,color:l.color,opacity:l.opacity,
                                 visible:l.visible,geojson:l.geojson}))};
}
function savedPanel(){
  const list=loadSaved();
  return `<h2>Saved work</h2><p class="sub">Keep a map and its layers, reopen it later, or take it with you as a file.</p>`
    +`<div class="row"><input class="field" id="saveName" placeholder="Name this" style="flex:1;min-width:0">`
    +`<button class="btn pri" id="doSave" ${layers.length?"":"disabled"}>Save</button></div>`
    +(list.length?list.map((x,i)=>`<div class="layer" style="border-bottom:none;padding-bottom:2px">`
        +`<input class="nm" value="${esc(x.name)}" data-svnm="${i}" aria-label="Name"></div>`
        +`<div class="lctl" style="margin-left:0">`
          +`<span class="note" style="flex:1 1 100%;margin:0">${x.layers.length} layer${x.layers.length===1?"":"s"} &middot; ${esc(new Date(x.when).toLocaleString())}</span>`
          +`<button class="btn sm" data-svopen="${i}">Open</button>`
          +`<button class="btn sm" data-svexp="${i}">Export</button>`
          +`<button class="btn sm" data-svdel="${i}">Delete</button></div>`).join("")
      :`<div class="empty" style="margin-top:12px">Nothing saved yet.<br>Build something, then keep it here.</div>`)
    +`<div class="cat">Hand this off</div>`
    +`<p class="sub">A link carries the steps, not the answers. Opening it re-runs them against the same sources.</p>`
    +`<button class="btn wide" id="doShare" ${layers.length?"":"disabled"}>Copy a link that re-runs this</button>`
    +`<p class="sub" id="shareNote" hidden></p>`
    +`<div class="cat">Bring one back</div>`
    +`<label class="btn wide" style="cursor:pointer">Open a .branch.json file`
    +`<input type="file" id="impFile" accept=".json" hidden></label>`;
}
function wireSaved(){
  const el=$("panelBody");
  const nm=$("saveName"), go=$("doSave");
  if(go) go.onclick=()=>{
    const list=loadSaved();
    list.unshift({name:(nm&&nm.value.trim())||`Untitled, ${new Date().toLocaleDateString()}`,
                  when:new Date().toISOString(),...snapshot()});
    putSaved(list); renderPanel();
  };
  const sh=$("doShare");
  if(sh) sh.onclick=async()=>{
    const {st,skipped}=shareState();
    const url=location.origin+location.pathname+"#s="+b64(JSON.stringify(st));
    const note=$("shareNote"); note.hidden=false;
    const say=`It rebuilds ${st.l.length} layer${st.l.length===1?"":"s"} by re-running the tools.`
      +(skipped?` ${skipped} left out: data brought in by hand has no recipe to replay.`:"");
    try{ await navigator.clipboard.writeText(url); note.textContent="Link copied. "+say; }
    catch(e){ note.innerHTML=`${esc(say)}<input class="field" style="margin-top:8px;width:100%" readonly value="${esc(url)}">`; }
  };
  el.querySelectorAll("[data-svopen]").forEach(b=>b.onclick=()=>{
    const x=loadSaved()[+b.dataset.svopen]; if(!x) return;
    layers.slice().forEach(removeLayer);
    (x.layers||[]).slice().reverse().forEach(l=>{
      const L=addLayer(l.name,l.geojson,{fit:false,color:l.color});
      L.opacity=l.opacity??1; L.visible=l.visible!==false; setVis(L); applyOpacity(L);
    });
    (x.overlays||[]).forEach(id=>{ if(!active.has(id)) toggleOverlay(id); });
    if(x.v) map.jumpTo({center:[x.v[1],x.v[0]],zoom:x.v[2]});
    tab="layers"; renderPanel();
  });
  el.querySelectorAll("[data-svexp]").forEach(b=>b.onclick=()=>{
    const x=loadSaved()[+b.dataset.svexp]; if(!x) return;
    const url=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url; a.download=(x.name||"analysis").replace(/[^a-z0-9]+/gi,"_").toLowerCase()+".branch.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  });
  el.querySelectorAll("[data-svdel]").forEach(b=>b.onclick=()=>{
    const l=loadSaved(); l.splice(+b.dataset.svdel,1); putSaved(l); renderPanel(); });
  el.querySelectorAll("[data-svnm]").forEach(inp=>{
    inp.onchange=()=>{ const l=loadSaved(); const it=l[+inp.dataset.svnm];
      if(it&&inp.value.trim()){ it.name=inp.value.trim(); putSaved(l); } };
  });
  const imp=$("impFile");
  if(imp) imp.onchange=e=>{
    const f=e.target.files[0]; imp.value=""; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const x=JSON.parse(r.result);
        if(!x||!Array.isArray(x.layers)) throw new Error("that is not a branch file");
        const l=loadSaved(); l.unshift(x); putSaved(l); renderPanel();
      }catch(err){ openCard("Could not open that",`<div class="sec">${esc(err.message)}</div>`); } };
    r.readAsText(f);
  };
}

/* ---- Ask: a conversation that can also act ----------------------------- */
let chat=[], thread=[];
function askPanel(){
  return `<h2>Ask the map</h2>`
    +`<p class="sub">Ask in plain English. branch runs real tools, shows every step, and can arrange the map for you.</p>`
    +`<div id="thread">${thread.map(m=>msgHTML(m)).join("")}</div>`
    +`<textarea class="field" id="q2" placeholder="e.g. show me the buildings in the Bronx and how much of it is within a 10 minute walk of a park"></textarea>`
    +`<div class="row" style="margin-top:8px">`
      +`<button class="btn pri" id="askBtn" style="flex:1">Ask branch</button>`
      +`<label class="btn" title="Attach a GeoJSON or CSV" style="cursor:pointer">Attach`
      +`<input type="file" id="chatFile" accept=".geojson,.json,.csv" hidden></label></div>`
    +(chat.length?`<button class="btn wide sm" id="clearChat" style="margin-top:8px">Clear the conversation</button>`:"")
    +`<div class="note">Needs your own model key, kept in this browser. Every tool still works without one.</div>`;
}
function msgHTML(m){
  if(m.role==="you") return `<div class="msg you">${esc(m.text)}</div>`;
  if(m.role==="err") return `<div class="msg err">${m.html||esc(m.text)}</div>`;
  return `<div class="msg branch">${esc(m.text)}${receiptsHTML(m.receipts)}${stepsHTML(m.steps)}</div>`;
}
function receiptsHTML(r){
  if(!r||!r.checked) return "";
  if(r.clean) return `<div class="receipt ok">All ${r.traced} figure${r.traced===1?"":"s"} here came from a tool run.</div>`;
  return `<div class="receipt warn"><b>${r.traced} of ${r.checked} figures traced.</b>`
    +`<div class="note" style="margin:3px 0 5px">These matched no tool that ran, so check them:</div>`
    +(r.orphans||[]).map(o=>`<div class="orphan"><b>${esc(o.value)}</b> <span>${esc(o.phrase)}</span></div>`).join("")
    +`</div>`;
}
function stepsHTML(steps){
  if(!steps||!steps.length) return "";
  return `<details class="steps"><summary>${steps.length} step${steps.length===1?"":"s"}</summary>`
    +steps.map((st,i)=>`<div class="stepline"><b>${i+1}. ${esc(st.tool)}</b>`
      +(st.feature_count!=null?`<span class="stepn">${st.feature_count} features</span>`:"")
      +`<span>${esc(JSON.stringify(st.recipe||st.params||{}).slice(0,140))}</span></div>`).join("")
    +`</details>`;
}
function pushMsg(m){ thread.push(m); if(tab==="ask") renderPanel(); }
function wireAsk(){
  const btn=$("askBtn"); if(btn) btn.onclick=ask;
  const q=$("q2");
  if(q){ q.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") ask(); };
         q.focus(); }
  const f=$("chatFile"); if(f) f.onchange=e=>{ readFile(e.target.files[0]); f.value=""; };
  const c=$("clearChat"); if(c) c.onclick=()=>{ chat=[]; thread=[]; renderPanel(); };
  const t=$("thread"); if(t) t.scrollTop=t.scrollHeight;
}
function llmConfig(){
  try{ const c=JSON.parse(localStorage.getItem("branch_llm")||"{}");
    return c.provider?c:{provider:"anthropic",model:"claude-sonnet-4-5"}; }
  catch(e){ return {provider:"anthropic"}; }
}
async function ask(){
  const q=$("q2"); const text=(q&&q.value.trim())||""; if(!text) return;
  pushMsg({role:"you",text});
  chat.push({role:"user",content:text});
  if($("q2")) $("q2").value="";
  busy(true,"branch is working");
  try{
    const r=await fetch("/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text,llm:llmConfig(),history:chat.slice(0,-1),
        context:{layers:layers.map(l=>l.name),overlays:[...active]}})});
    const d=await r.json();
    if(d.error){
      const needsKey=/key|provider|ollama/i.test(d.error);
      pushMsg({role:"err",html:esc(d.error)
        +(needsKey?`<div class="note">Add a key in AI settings, or use the Tools tab, which needs none.</div>`:"")});
    } else {
      (d.layers||[]).forEach((ly,i)=>{
        if(!ly.geojson||!ly.geojson.features) return;
        const t=tools.find(x=>x.id===ly.tool);
        addLayer((t&&t.noun)||ly.tool||"Result",ly.geojson,{fit:i===0});
      });
      applyWorkspaceActions(d.steps);
      pushMsg({role:"branch",text:d.answer||"Done.",steps:d.steps,receipts:d.receipts});
      chat.push({role:"assistant",content:d.answer||"Done."});
    }
  }catch(e){ pushMsg({role:"err",text:"Could not reach the server."}); }
  finally{ busy(false); }
}
// The assistant asked for the workspace to change; carry it out here, where the
// map and the panels actually live.
function applyWorkspaceActions(steps){
  (steps||[]).forEach(st=>{
    if(st.tool!=="workspace") return;
    const a=st.recipe||{};
    const byName=n=>layers.find(l=>l.name.toLowerCase().includes(String(n||"").toLowerCase()));
    try{
      if(a.action==="show_overlay"&&!active.has(a.target)) toggleOverlay(a.target);
      else if(a.action==="hide_overlay"&&active.has(a.target)) toggleOverlay(a.target);
      else if(a.action==="set_basemap"&&BASEMAPS[a.target]){
        document.querySelectorAll("#basemaps button").forEach(x=>x.classList.toggle("on",x.dataset.b===a.target));
        setBasemapTo(a.target);
      }
      else if(a.action==="fly_to"&&isFinite(a.lon)&&isFinite(a.lat))
        map.flyTo({center:[a.lon,a.lat],zoom:a.zoom||14});
      else if(a.action==="open_table"){ const L=byName(a.target); if(L) tableCard(L); }
      else if(a.action==="check_layer"){ const L=byName(a.target); if(L) profileCard(L); }
      else if(a.action==="zoom_to_layer"){ const L=byName(a.target); if(L) fitTo(L.geojson); }
      else if(a.action==="hide_layer"){ const L=byName(a.target); if(L){ L.visible=false; setVis(L); } }
      else if(a.action==="show_layer"){ const L=byName(a.target); if(L){ L.visible=true; setVis(L); } }
      else if(a.action==="set_dock"&&["right","bottom"].includes(a.target)){
        layout.dock=a.target; saveLayout(); applyLayout();
      }
    }catch(e){}
  });
}

/* ---- tool form, in the panel, never a window --------------------------- */
function openTool(id){
  const t=tools.find(x=>x.id===id); if(!t) return;
  const props=(t.params&&t.params.properties)||{}, req=(t.params&&t.params.required)||[];
  let fields="";
  for(const [k,p] of Object.entries(props)){
    const fid="f_"+k, isLayer=p.type==="object";
    const isBbox=p.type==="array"&&(p.maxItems===4||k==="bbox");
    const isPt=p.type==="array"&&!isBbox;
    fields+=`<label class="lb" for="${fid}"><b>${esc(k)}</b>${req.includes(k)?" (required)":""} ${esc(p.description||"")}</label>`;
    if(isLayer) fields+=layers.length
      ? `<select id="${fid}" class="field" data-k="${k}" data-kind="layer">`
        +layers.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join("")+`</select>`
      : `<select id="${fid}" class="field" disabled><option>no layers yet</option></select>`;
    else if(isBbox) fields+=`<button id="${fid}" class="btn wide" type="button" data-k="${k}" data-kind="bbox">Use the current map view</button>`;
    else if(isPt) fields+=`<button id="${fid}" class="btn wide" type="button" data-k="${k}" data-kind="point">Click the map to set</button>`;
    else if(p.enum) fields+=`<select id="${fid}" class="field" data-k="${k}" data-kind="val">`
      +p.enum.map(o=>`<option>${esc(o)}</option>`).join("")+`</select>`;
    else fields+=`<input id="${fid}" class="field" data-k="${k}" data-kind="val" `
      +`${p.type==="number"||p.type==="integer"?'type="number" step="any"':""} value="${p.default??""}" placeholder="${esc(p.type||"")}">`;
  }
  $("panelBody").innerHTML=`<button class="btn sm" id="back">&larr; All tools</button>`
    +`<h2 style="margin-top:12px">${esc(t.title)}</h2><p class="sub">${esc(t.description)}</p>`
    +fields+`<div style="margin-top:16px"><button class="btn pri wide" id="run">Run</button></div>`;
  $("back").onclick=()=>{ tab="tools"; renderPanel(); };
  $("panelBody").querySelectorAll('[data-kind="bbox"]').forEach(b=>b.onclick=()=>{
    const bb=map.getBounds();
    b.dataset.val=JSON.stringify([bb.getWest(),bb.getSouth(),bb.getEast(),bb.getNorth()]);
    b.textContent="map view set";
  });
  $("panelBody").querySelectorAll('[data-kind="point"]').forEach(b=>b.onclick=()=>{
    pickTarget=b; b.textContent="click the map..."; map.getCanvas().style.cursor="crosshair";
  });
  if(props.url){
    $("f_url").insertAdjacentHTML("afterend",

async function runTool(t){
  const params={}, prov={};
  $("panelBody").querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k, kind=el.dataset.kind; let v;
    if(kind==="layer"){ if(el.value!==""){ v=layers[+el.value].geojson; prov[k]={ref:layers[+el.value].id}; } }
    else if(kind==="bbox"||kind==="point"){ if(el.dataset.val) v=JSON.parse(el.dataset.val); }
    else { v=el.value; if(el.type==="number"&&v!=="") v=+v; }
    if(v!==undefined&&v!==""){ params[k]=v; if(prov[k]===undefined) prov[k]=v; }
  });

  if(need.length){ openCard("Needs input",`<div class="sec">Still needed: <b>${esc(need.join(", "))}</b>.</div>`); return; }
  busy(true,`Running ${t.title}`);

function wireList(r){
  const btn=$("noticeCsv"); if(!btn) return;
  btn.onclick=()=>{
    const rows=r.notice_list||[];
    // Excel and Sheets execute a cell that starts with = + - or @, so a name
    // out of an assessor's database is prefixed to keep it text. \r matters as
    // much as \n: legacy exports use a bare CR inside addresses.
    const cell=v=>{
      let t=v==null?"":String(v);
      if(/^[=+\-@\t\r]/.test(t)) t="'"+t;
      return /["\,\n\r]/.test(t)?`"${t.replace(/"/g,'""')}"`:t;
    };
    const csv=["owner,mailing address,distance in feet"]
      .concat(rows.map(x=>[x.owner&&x.owner!=="nan"?x.owner:"",
                           x.address&&x.address!=="nan"?x.address:"",
                           x.distance_ft].map(cell).join(",")))
      .join("\n");
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    const a=document.createElement("a");
    a.href=url; a.download=`notice_list_${r.distance_ft}ft.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };
}

function readFile(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let gj=f.name.toLowerCase().endsWith(".csv")?csvToGeo(r.result):JSON.parse(r.result);
      if(gj.type==="Feature") gj={type:"FeatureCollection",features:[gj]};
      if(!gj.features||!gj.features.length) throw new Error("there are no features in it");
      const pts=[]; (gj.features||[]).slice(0,200).forEach(x=>eachCoord(x.geometry,c=>pts.push(c)));
      if(pts.some(c=>Math.abs(c[0])>180||Math.abs(c[1])>90))
        throw new Error("this file is in a projected coordinate system, not longitude and latitude. "
          +"Use the reproject tool with its EPSG code.");
      const far=farFromView(gj);
      const L=addLayer(f.name,gj,{src:{f:f.name},fit:true});
      noteUpload(f.name,(gj.features||[]).length,
        far?`Heads up: this landed about ${far.km.toLocaleString()} km from where you were looking. `
           +`That is normal for another city, but it is also what a wrong EPSG code looks like. `
           +`If it is in the wrong place, run the reproject tool with the right code.`:null);
      tab="layers"; renderPanel();
    }catch(e){ openCard("Could not read that file",`<div class="sec">${esc(e.message)}</div>`); }
  };
  r.readAsText(f);
}
function parseCsv(txt){
  const rows=[]; let row=[],cell="",q=false;
  const t=txt.replace(/^﻿/,"");
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}
function csvToGeo(txt){
  const rows=parseCsv(txt);
  if(rows.length<2) throw new Error("that file has no rows under its header");
  const head=rows[0].map(h=>String(h).trim()), lower=head.map(h=>h.toLowerCase());
  const la=lower.findIndex(h=>["lat","latitude","y"].includes(h));
  const lo=lower.findIndex(h=>["lon","lng","long","longitude","x"].includes(h));
  if(la<0||lo<0) throw new Error("it needs a latitude and a longitude column. Found: "+head.slice(0,8).join(", "));
  const num=v=>{ const t=String(v==null?"":v).trim().replace(/^\+/,"");
    return /^-?\d*\.?\d+(e[+-]?\d+)?$/i.test(t)?Number(t):NaN; };
  const coerce=v=>{ const t=String(v).trim(); if(t==="") return null;
    if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)){ const n=Number(t.replace(/,/g,"")); if(isFinite(n)) return n; }
    if(/^\$?-?\d*\.?\d+%?$/.test(t)){ const n=Number(t.replace(/[$%]/g,"")); if(isFinite(n)) return n; }
    return t; };
  const feats=[];
  rows.slice(1).forEach(c=>{
    const y=num(c[la]), x=num(c[lo]);
    if(!isFinite(x)||!isFinite(y)||Math.abs(y)>90||Math.abs(x)>180) return;
    const p={}; head.forEach((h,i)=>{ if(i!==la&&i!==lo) p[h]=coerce(c[i]); });
    p.latitude=y; p.longitude=x;
    feats.push({type:"Feature",geometry:{type:"Point",coordinates:[x,y]},properties:p});
  });
  if(!feats.length) throw new Error("none of the rows had a usable latitude and longitude");
  return {type:"FeatureCollection",features:feats};
}
function download(L){
  const url=URL.createObjectURL(new Blob([JSON.stringify(L.geojson)],{type:"application/geo+json"}));
  const a=document.createElement("a");
  a.href=url; a.download=(L.name||"layer").replace(/[^a-z0-9]+/gi,"_").toLowerCase()+".geojson";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

    {id:"ov-r",type:"line","source-layer":"segment",
     paint:{"line-color":["match",["get","class"],"motorway","#e6c07b","trunk","#e6c07b",
       "primary","#d3ab68","footway","#8ed3a6","path","#8ed3a6","#78867d"],

const active=new Set();
function overlayBar(){
  $("overlays").innerHTML=OVERLAYS.map(o=>
    `<button data-ov="${o.id}" class="${active.has(o.id)?"on":""}" aria-pressed="${active.has(o.id)}">${esc(o.label)}</button>`).join("");

}
function firstUserLayer(){
  try{ const ls=(map.getStyle()||{}).layers||[];
    const f=ls.find(l=>String(l.id).startsWith("ly")); return f?f.id:undefined; }catch(e){ return undefined; }
}
function addOverlay(ov){
  const sid="ovsrc-"+ov.theme;
  if(!map.getSource(sid)) map.addSource(sid,{type:"vector",url:PM(ov.theme),
    attribution:"&copy; Overture Maps Foundation (ODbL)"});
  const before=firstUserLayer();
  ov.layers.forEach(l=>{ if(!map.getLayer(l.id)) map.addLayer({...l,source:sid},before); });

}
function toggleOverlay(id){
  const ov=OVERLAYS.find(o=>o.id===id); if(!ov) return;
  if(active.has(id)){ active.delete(id); ov.layers.forEach(l=>{ if(map.getLayer(l.id)) map.removeLayer(l.id); }); }
  else{
    try{ addOverlay(ov); active.add(id);
      if(id==="buildings"&&map.getPitch()===0) map.easeTo({pitch:50,duration:700});
    }catch(e){ openCard("Overlay unavailable",`<div class="sec">${esc(e.message)}</div>`); }
  }

}

/* ---- draw --------------------------------------------------------------- */
function drawPreview(){
  const fc={type:"FeatureCollection",features:drawPts.map(c=>({type:"Feature",properties:{},
    geometry:{type:"Point",coordinates:c}}))};
  if(drawPts.length>1) fc.features.push({type:"Feature",properties:{},
    geometry:{type:"LineString",coordinates:[...drawPts,drawPts[0]]}});
  const s=map.getSource("drawprev"); if(s) s.setData(fc);
}
function addDrawLayers(){
  if(map.getSource("drawprev")) return;
  map.addSource("drawprev",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"drawprev-l",source:"drawprev",type:"line",filter:["==","$type","LineString"],
    paint:{"line-color":ACCENT,"line-width":2.5,"line-dasharray":[2,1.4]}});
  map.addLayer({id:"drawprev-p",source:"drawprev",type:"circle",filter:["==","$type","Point"],
    paint:{"circle-radius":4.5,"circle-color":ACCENT,"circle-stroke-width":1.5,"circle-stroke-color":BG}});
}
function finishDraw(){
  if(drawMode!=="polygon"||drawPts.length<3) return;
  const g={type:"Polygon",coordinates:[[...drawPts,drawPts[0]]]};
  addLayer("Drawn area",{type:"FeatureCollection",features:[{type:"Feature",properties:{drawn:true},geometry:g}]},
    {fit:false,src:{d:{type:g.type}}});
  areaCard(g);
  drawPts=[]; drawPreview();
}
function areaCard(geom){
  const R=6378137, rad=d=>d*Math.PI/180;
  const ringArea=r=>{ let s=0; for(let i=0,n=r.length;i<n;i++){ const [x1,y1]=r[i],[x2,y2]=r[(i+1)%n];
    s+=(rad(x2)-rad(x1))*(2+Math.sin(rad(y1))+Math.sin(rad(y2))); } return Math.abs(s*R*R/2); };
  const total=geom.coordinates.reduce((a,r,i)=>a+(i?-1:1)*ringArea(r),0);
  const ids=[...active].flatMap(id=>(OVERLAYS.find(o=>o.id===id)||{layers:[]}).layers
    .filter(l=>map.getLayer(l.id)).map(l=>l.id));
  let counted=0, byClass={};
  if(ids.length){
    const pts=[]; eachCoord(geom,c=>{ try{ pts.push(map.project(c)); }catch(e){} });
    if(pts.length){
      const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
      let feats=[];
      try{ feats=map.queryRenderedFeatures([[Math.min(...xs),Math.min(...ys)],
        [Math.max(...xs),Math.max(...ys)]],{layers:ids}); }catch(e){}
      feats.forEach(f=>{ counted++;
        const c=(f.properties||{}).class||(f.properties||{}).subtype||"unclassified";
        byClass[c]=(byClass[c]||0)+1; });
    }
  }
  const chips=Object.entries(byClass).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([c,n])=>`<span>${esc(String(c).replace(/_/g," "))} <b>${n}</b></span>`).join("");
  openCard("This area",
    `<div class="sec"><div class="kvbig"><span>area drawn</span><b>${qty(total/M2_ACRE,"acres")}</b></div>`
    +(counted?`<dl class="kv"><dt>features counted from active overlays</dt><dd>${counted.toLocaleString()}</dd></dl>`
        +`<div class="chips">${chips}</div>`
        +`<div class="note">Counted from the map tiles currently on screen. Zoom in for a complete count.</div>`
      :`<div class="note">Turn on an overlay such as Buildings or Roads and draw again to get a breakdown of what is inside.</div>`)
    +`</div>`);
}

  street:{tiles:["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png"],attr:"&copy; OpenStreetMap &copy; CARTO"},
  satellite:{tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],attr:"&copy; Esri, Maxar"},
